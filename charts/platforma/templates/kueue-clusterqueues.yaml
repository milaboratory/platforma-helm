{{- if and (eq .Values.kueue.mode "dedicated") .Values.kueue.dedicated.createClusterResources }}
# =============================================================================
# ClusterQueues
# =============================================================================
# Two ClusterQueues in the same cohort:
#
# 1. UI ClusterQueue (ui-tasks):
#    - Interactive work, highest priority
#    - GUARANTEED resources via borrowingLimit: 0 (doesn't borrow from batch)
#    - Always has its nominal quota available
#
# 2. Batch ClusterQueue (light, medium, heavy):
#    - Priority ordering: heavy (1000) > medium (100) > light (10)
#    - CAN borrow from UI when UI is idle (up to borrowingLimit)
#    - Jobs are NOT preemptable (reclaimWithinCohort: Never)
#
# Resource flow: UI resources stay reserved; Batch can use idle UI capacity.
# =============================================================================
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ include "platforma.kueue.uiClusterQueueName" . }}
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
spec:
  cohortName: {{ include "platforma.kueue.clusterResourceName" . }}
  namespaceSelector: {}
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: {{ include "platforma.kueue.clusterResourceName" . }}-ui-flavor
          resources:
            - name: cpu
              nominalQuota: {{ .Values.kueue.dedicated.resources.ui.cpu | quote }}
              # UI queue does NOT borrow - guarantees resources for interactive work
              borrowingLimit: "0"
            - name: memory
              nominalQuota: {{ .Values.kueue.dedicated.resources.ui.memory | quote }}
              borrowingLimit: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ include "platforma.kueue.batchClusterQueueName" . }}
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
spec:
  cohortName: {{ include "platforma.kueue.clusterResourceName" . }}
  namespaceSelector: {}
  {{- if .Values.kueue.provisioningRequest.enabled }}
  admissionChecksStrategy:
    admissionChecks:
      # Scope ProvisioningRequest check to the CPU-only batch flavor.
      # GPU jobs skip ProvReq because best-effort-atomic-scale-up's strict
      # capacity planner often refuses GPU scale-ups that a plain MIG resize
      # would satisfy (per (machine-type, zone) inventory variance), and
      # atomic reservation is unnecessary for single-pod GPU blocks. Keep
      # ProvReq on the CPU flavor where multi-pod batch atomicity helps.
      - name: {{ include "platforma.kueue.admissionCheckName" . }}
        onFlavors:
          - {{ include "platforma.kueue.clusterResourceName" . }}-batch-flavor
  {{- end }}
  preemption:
    reclaimWithinCohort: Never   # Jobs not retryable, never preempt
    withinClusterQueue: Never    # No preemption within batch queue
  resourceGroups:
{{- if .Values.kueue.pools.gpu.enabled }}
    # Flavor declaration order matters: Kueue tries flavors top-down and
    # assigns the first one whose quota fits the workload. batch-flavor
    # is listed FIRST so CPU-only jobs land there and go through the
    # ProvisioningRequest AdmissionCheck (admissionChecksStrategy above).
    # If gpu-flavor came first, CPU-only jobs requesting < gpu.cpu/memory
    # would silently be assigned to gpu-flavor and bypass ProvReq (the
    # check is scoped onFlavors=[batch-flavor]), so multi-pod batch
    # atomicity would only hold while gpu-flavor was fully saturated.
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: {{ include "platforma.kueue.clusterResourceName" . }}-batch-flavor
          resources:
            - name: cpu
              nominalQuota: {{ .Values.kueue.dedicated.resources.batch.cpu | quote }}
              borrowingLimit: {{ .Values.kueue.dedicated.resources.ui.cpu | quote }}
            - name: memory
              nominalQuota: {{ .Values.kueue.dedicated.resources.batch.memory | quote }}
              borrowingLimit: {{ .Values.kueue.dedicated.resources.ui.memory | quote }}
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
        - name: {{ include "platforma.kueue.clusterResourceName" . }}-gpu-flavor
          resources:
            - name: cpu
              nominalQuota: {{ .Values.kueue.dedicated.resources.gpu.cpu | quote }}
            - name: memory
              nominalQuota: {{ .Values.kueue.dedicated.resources.gpu.memory | quote }}
            - name: "nvidia.com/gpu"
              nominalQuota: {{ .Values.kueue.dedicated.resources.gpu.gpu | quote }}
{{- else }}
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: {{ include "platforma.kueue.clusterResourceName" . }}-batch-flavor
          resources:
            - name: cpu
              nominalQuota: {{ .Values.kueue.dedicated.resources.batch.cpu | quote }}
              # Batch CAN borrow idle UI capacity (limited to UI's quota)
              borrowingLimit: {{ .Values.kueue.dedicated.resources.ui.cpu | quote }}
            - name: memory
              nominalQuota: {{ .Values.kueue.dedicated.resources.batch.memory | quote }}
              borrowingLimit: {{ .Values.kueue.dedicated.resources.ui.memory | quote }}
{{- end }}
{{- end }}
