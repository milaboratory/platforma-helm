{{- if and .Values.kueue.pools.gpu.enabled (eq .Values.kueue.mode "dedicated") .Values.kueue.dedicated.createClusterResources .Values.kueue.pools.gpu.devicePlugin.enabled }}
# =============================================================================
# NVIDIA Device Plugin DaemonSet
# =============================================================================
# Exposes nvidia.com/gpu resources on GPU nodes so the K8s scheduler can
# assign GPU workloads. Only runs on nodes with NVIDIA GPUs.
#
# Gated on the same condition as the cluster-scoped Kueue resources
# (ClusterQueues, ResourceFlavors): this DaemonSet and its cluster-scoped RBAC
# are cluster-wide infrastructure, deployed once by the install that owns the
# Kueue cohort (dedicated mode + createClusterResources). Shared-mode and
# secondary installs still set kueue.pools.gpu.enabled=true to route GPU jobs
# and enable the runner GPU flag, but must NOT re-deploy these cluster-scoped
# objects — two releases doing so collide on the identical resource names.
#
# ALSO gated on kueue.pools.gpu.devicePlugin.enabled (default true), which opts
# out of the plugin independently of the Kueue resources above. Needed on
# on-premises clusters where the NVIDIA GPU Operator owns GPU enablement instead:
# it ships its own device plugin, and two plugins on one node fight over
# /var/lib/kubelet/device-plugins. Note the opt-out also drops the gpu-not-ready
# taint-remover sidecar below — fine when NVIDIA GPU Operator controls this flag via
# nvidia-operator-validator on cluster level with persistent nodes or nodes managed by,
# some separate mechanisms. Setting it to 'false' on clusters with dynamic node management
# that does not automatically prepare GPU drivers breaks GPU scheduling.
# Based on: https://github.com/NVIDIA/k8s-device-plugin v0.17.0
#
# Startup taint protocol:
#   GPU nodes boot with nvidia.com/gpu-not-ready=true:NoSchedule (set in
#   CloudFormation Nodegroup). The taint blocks pods until the device plugin
#   registers nvidia.com/gpu capacity. The taint-remover sidecar polls the
#   node's allocatable GPU count and removes the taint once it becomes >= 1.
#   Cluster Autoscaler is configured with --startup-taints=nvidia.com/gpu-not-ready
#   so the node is treated as upcoming until the taint clears, preventing
#   spurious double scale-ups.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
  namespace: kube-system
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvidia-device-plugin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvidia-device-plugin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvidia-device-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
subjects:
  - kind: ServiceAccount
    name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "platforma.fullname" . }}-nvidia-device-plugin
  namespace: kube-system
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      serviceAccountName: {{ include "platforma.fullname" . }}-nvidia-device-plugin
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu-not-ready
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
        - name: gpu-not-ready-taint-remover
          image: alpine/k8s:1.35.4
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for nvidia.com/gpu capacity on node $NODE_NAME..."
              until [ "$(kubectl get node "$NODE_NAME" -o 'jsonpath={.status.allocatable.nvidia\.com/gpu}')" -ge 1 ] 2>/dev/null; do
                sleep 2
              done
              echo "GPU registered, removing nvidia.com/gpu-not-ready taint"
              kubectl taint node "$NODE_NAME" nvidia.com/gpu-not-ready- || true
              echo "Done. Sleeping forever (sidecar)."
              sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
