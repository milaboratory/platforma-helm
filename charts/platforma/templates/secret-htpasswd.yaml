# =============================================================================
# htpasswd Secret (auto-generated from inline credentials)
# =============================================================================
# Created only when auth.htpasswd.credentials is set.
# When using auth.htpasswd.secretName, this template is skipped.
# =============================================================================

{{- if and (gt (len .Values.auth.htpasswd.credentials) 0) (not .Values.auth.htpasswd.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platforma.fullname" . }}-htpasswd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{ .Values.auth.htpasswd.secretKey }}: {{ include "platforma.htpasswdFileContent" . | b64enc }}
{{- end }}

{{- /* ---------------------------------------------------------------------
     Per-provider htpasswd Secrets (auth.providers[].htpasswd.credentials).
     One Secret per htpasswd provider that supplies inline credentials; a
     provider pointing at htpasswd.secretName is skipped, same as above.
     --------------------------------------------------------------------- */ -}}
{{- $ctx := . -}}
{{- range $p := default (list) $ctx.Values.auth.providers }}
{{- $id := $p.name }}
{{- $h := default (dict) $p.htpasswd }}
{{- if and (eq $p.type "htpasswd") (gt (len (default (list) $h.credentials)) 0) (not $h.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platforma.fullname" $ctx }}-auth-{{ $id }}-htpasswd
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "platforma.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{ $h.secretKey | default "htpasswd" }}: {{ include "platforma.auth.providerHtpasswdContent" (dict "provider" $p) | b64enc }}
{{- end }}
{{- end }}
