# =============================================================================
# StorageClasses (optional, cluster-scoped)
# =============================================================================
# Created automatically when environment: aws. These are cluster-scoped resources.
# GKE and AKS ship with required StorageClasses pre-configured.
# =============================================================================

{{- if eq .Values.environment "aws" }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
{{- with (include "platforma.scratchStorage" . | fromYaml).network.storageClass }}
{{- if and .create .name }}
---
# Network-tier scratch: one volume per job, created when the job starts and deleted
# with it. WaitForFirstConsumer is mandatory — the volume must be created in the zone
# of the node the scheduler picked, not before it.
#
# No allowVolumeExpansion: expansion is an operator action on a PVC that outlives the
# thing that filled it, and this PVC dies with its pod. A job that runs out of scratch
# space gets ENOSPC, the same as any full filesystem; the answer is a larger request,
# not a larger volume underneath a failing job.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "platforma.labels" $ | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: {{ .type | quote }}
  iops: {{ .iops | quote }}
  throughput: {{ .throughput | quote }}
  encrypted: {{ .encrypted | quote }}
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
{{- end }}
{{- end }}
{{- if .Values.storage.workspace.efs.fileSystemId }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-platforma
  labels:
    {{- include "platforma.labels" . | nindent 4 }}
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: {{ .Values.storage.workspace.efs.fileSystemId }}
  directoryPerms: "755"
  uid: "1010"
  gid: "1010"
  basePath: "/dynamic"
{{- end }}
{{- end }}
