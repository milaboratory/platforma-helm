# Filled by compose-auth.py. $name is the RFC 1123 provider id (the slot name).
name: $name
type: sso
sso:
  issuer: https://accounts.google.com
  clientId: $clientId
  scopes: openid profile email
  prompt: consent
  accessType: offline
  clientSecret:
    secretName: $secretName
map:
  login: email
  email: email
  displayName: name
lookUpAttr: email
createUsers: true
