  # ---------------------------------------------------------------------------
  # 4. Node groups
  # ---------------------------------------------------------------------------

  # Launch templates — propagate tags to EC2 instances and EBS volumes for
  # cost tracking, and set root volume sizes per node type.
  # EKS auto-tags ASGs for cluster-autoscaler discovery.
  #
  # SmallNodeLaunchTemplate:  system and ui nodes (50 GiB root)
  # MediumNodeLaunchTemplate: batch 16c/32c nodes (100 GiB root)
  # LargeNodeLaunchTemplate:  batch 64c and high-memory nodes (200 GiB root)
  SmallNodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # Do NOT set ImageId — EKS selects the optimised AMI automatically.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: platforma
                Value: !Ref ClusterName
          - ResourceType: volume
            Tags:
              - Key: platforma
                Value: !Ref ClusterName

  MediumNodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # Do NOT set ImageId — EKS selects the optimised AMI automatically.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: platforma
                Value: !Ref ClusterName
          - ResourceType: volume
            Tags:
              - Key: platforma
                Value: !Ref ClusterName

  LargeNodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # Do NOT set ImageId — EKS selects the optimised AMI automatically.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 200
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: platforma
                Value: !Ref ClusterName
          - ResourceType: volume
            Tags:
              - Key: platforma
                Value: !Ref ClusterName

  # ---------------------------------------------------------------------------
  # Node group creation waves
  # ---------------------------------------------------------------------------
  # EKS makes one ec2:RunInstances call to validate each node group it creates.
  # EC2 limits how many RunInstances calls an account can make per second, in a
  # token bucket that is shared by the whole account and region. The bucket does
  # not look at the instance type, so all node groups drain the same bucket.
  #
  # A region with full GPU coverage has 14 node groups. CloudFormation created
  # all of them at the same time, which made 13 RunInstances calls in one second
  # and emptied the bucket. EKS retries a few times, then gives up:
  #   "Request limit exceeded ... throttled on ec2:RunInstances"
  # One node group then fails and the whole stack rolls back.
  #
  # The DependsOn lines below cut the fan-out into 4 waves. No wave starts more
  # than 5 node groups, and the first wave starts only 4. Waves after the first
  # spread out on their own, because node groups take different times to create.
  #
  # Each row below is one DependsOn chain. Each column is one wave: the node
  # groups in a column start at the same time.
  #
  #   track      wave 1          wave 2          wave 3         wave 4
  #   ------------------------------------------------------------------
  #   system     System       -> Ui
  #   backend    Platforma
  #   batch a    Batch16c64   -> Batch32c128  -> Batch64c256
  #   gpu 24g                                 -> Gpu24g
  #   gpu g6f                 -> Gpu3g        -> Gpu6g       -> Gpu12g
  #   gpu t4                  -> Gpu16g
  #   batch b    Batch32c256  -> Batch64c512
  #   gpu g6e                 -> Gpu48g       -> Gpu96g
  #   ------------------------------------------------------------------
  #   concurrency   4               5               4              1
  #
  # Empty cells for a track mean it waits for the nearest node group above it
  # in that column (the gpu g6f track waits for Batch16c64 of wave 1, and the
  # gpu 24g track waits for Batch32c128 of wave 2).
  # The gpu t4 track and the other GPU tracks never appear in the same region,
  # so wave 2 never starts more than 5 in parallel.
  #
  # Row order is important. When you add node groups or change dependencies,
  # update this table.
  #
  # Two rules the chains must keep:
  #
  # 1. DependsOn must name a resource that exists. CloudFormation rejects the
  #    whole template with "Unresolved resource dependencies" if the target is
  #    removed by a false Condition, and DependsOn does not accept Fn::If. So a
  #    conditional GPU pool never waits for a pool of a different GPU card. It
  #    waits either for a pool of the same card (same Condition, so both exist
  #    or neither does) or for a batch node group, which has no Condition and is
  #    therefore present in every region.
  # 2. System and Platforma stay in wave 1. The backend deploy waits for both
  #    (TriggerPlatformaDeploy -> PlatformaNodeGroupV1, and the CSI addons ->
  #    SystemNodeGroupV5), so a delay there would delay the whole application.
  #    Nothing waits for the batch or GPU pools, and all of them start at size 0,
  #    so the waves only add a few minutes to the stack, not to the backend.
  #
  # System nodes host cluster-support / service pods only: Kueue, AppWrapper,
  # Cluster Autoscaler, ALB Controller, External DNS, CoreDNS, metrics-server and
  # the CSI controllers. The Platforma backend runs on its own dedicated node
  # group (PlatformaNodeGroupV1) so the server pod and the cluster services never
  # contend for memory or CPU — this lets the backend grow into a whole node.
  # Services are light, so m7i.2xlarge (8 vCPU / 32 GiB) is ample.
  # Renamed system-v4 -> system-v5 because the InstanceTypes change forces a
  # node group replacement, and the name is immutable.
  SystemNodeGroupV5:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: system-v5
      Version: !FindInMap [Constants, EKS, Version]
      NodeRole: !GetAtt NodeGroupRole.Arn
      InstanceTypes:
        - m7i.2xlarge
      ScalingConfig:
        DesiredSize: 1
        MinSize: 1
        MaxSize: 3
      # Pin system nodes to the same single AZ as the Platforma backend node and
      # its AZ-bound EBS volumes, keeping the CSI controllers and backend
      # co-located.
      Subnets: !If
        - CreateNewVpc
        - - !If [SystemAZa, !Ref PrivateSubnet1, !If [SystemAZb, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
        - - !If [SystemAZa, !Select [0, !Ref PrivateSubnetIds], !If [SystemAZb, !Select [1, !Ref PrivateSubnetIds], !Select [2, !Ref PrivateSubnetIds]]]
      LaunchTemplate:
        Id: !Ref SmallNodeLaunchTemplate
        Version: !GetAtt SmallNodeLaunchTemplate.LatestVersionNumber
      Labels:
        node.kubernetes.io/pool: system
      Tags:
        nodegroup-type: system
        platforma: !Sub "${ClusterName}"

  # Platforma backend node group — dedicated to the Platforma server pod so its
  # memory can grow without contending with the cluster-support services on the
  # system pool. Tainted dedicated=platforma:NoSchedule so nothing else
  # schedules here; the backend tolerates the taint and selects this pool
  # via app.nodeSelector (node.kubernetes.io/pool: platforma) in the deployer
  # values. Pinned to the same single AZ (SystemNodeAZ) as the backend's database
  # and logs PersistentVolumes (zonal EBS gp3), which can only attach to a node in
  # their own AZ. Single node (MinSize=MaxSize=1): the backend is a single-replica
  # Deployment with a Recreate strategy, so the pool never scales past one node.
  # m7i.4xlarge (16 vCPU / 64 GiB) gives the backend (16 GiB request / 32 GiB
  # limit) generous headroom to grow.
  PlatformaNodeGroupV1:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: platforma-v1
      Version: !FindInMap [Constants, EKS, Version]
      NodeRole: !GetAtt NodeGroupRole.Arn
      InstanceTypes:
        - m7i.4xlarge
      ScalingConfig:
        DesiredSize: 1
        MinSize: 1
        MaxSize: 1
      Subnets: !If
        - CreateNewVpc
        - - !If [SystemAZa, !Ref PrivateSubnet1, !If [SystemAZb, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
        - - !If [SystemAZa, !Select [0, !Ref PrivateSubnetIds], !If [SystemAZb, !Select [1, !Ref PrivateSubnetIds], !Select [2, !Ref PrivateSubnetIds]]]
      LaunchTemplate:
        Id: !Ref SmallNodeLaunchTemplate
        Version: !GetAtt SmallNodeLaunchTemplate.LatestVersionNumber
      Labels:
        node.kubernetes.io/pool: platforma
      Taints:
        - Key: dedicated
          Value: platforma
          Effect: NO_SCHEDULE
      Tags:
        nodegroup-type: platforma
        platforma: !Sub "${ClusterName}"

  UiNodeGroupV2:
    Type: AWS::EKS::Nodegroup
    DependsOn: SystemNodeGroupV5
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: ui-v2
      Version: !FindInMap [Constants, EKS, Version]
      NodeRole: !GetAtt NodeGroupRole.Arn
      InstanceTypes:
        - t3.xlarge
      ScalingConfig:
        DesiredSize: 0
        MinSize: 0
        MaxSize: !FindInMap [DeploymentSize, !Ref DeploymentSize, MaxUi]
      Subnets: !If
        - CreateNewVpc
        - - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PrivateSubnet3
        - !Ref PrivateSubnetIds
      LaunchTemplate:
        Id: !Ref SmallNodeLaunchTemplate
        Version: !GetAtt SmallNodeLaunchTemplate.LatestVersionNumber
      Labels:
        node.kubernetes.io/pool: ui
      Taints:
        - Key: dedicated
          Value: ui
          Effect: NO_SCHEDULE
      Tags:
        nodegroup-type: ui
        platforma: !Sub "${ClusterName}"

