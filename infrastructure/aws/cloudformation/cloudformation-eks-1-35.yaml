  # ---------------------------------------------------------------------------
  # 4b. GPU node groups — one pool per real GPU card, scale from 0
  # ---------------------------------------------------------------------------
  # All GPU resources (launch template + node groups) are gated by EnableGpu.
  # Set EnableGpu=false to skip GPU costs entirely.
  #
  # Each pool corresponds to a REAL GPU card, and its gpu-memory-gib label equals
  # that card's actual per-GPU VRAM. A region gets ONLY the pools whose card it
  # actually offers (gated by the RegionHas* Conditions above, generated by
  # generate-gpu-map.sh) — no fallback substitution, so a label never lies and
  # hardware is never under-used. See gpu-instance-map.json for the per-region
  # pool set. The GpuSubnetResolver Lambda picks each pool's exact instance type
  # (e.g. gpu-24g -> g6 or g5) and the subnets in AZs that offer it.
  #
  # pool     card                 label  instance      created where
  # gpu-3g   L4 fractional (g6f)  3      g6f.xlarge    g6f offered
  # gpu-6g   L4 fractional (g6f)  6      g6f.2xlarge   g6f offered
  # gpu-12g  L4 fractional (g6f)  12     g6f.4xlarge   g6f offered
  # gpu-24g  L4 / A10G            24     g6.2xlarge|g5.2xlarge   g6 or g5 offered
  # gpu-48g  L40S (g6e)           48     g6e.2xlarge   g6e offered
  # gpu-96g  4× L40S (g6e)        48     g6e.12xlarge  g6e offered
  # gpu-16g  T4 (g4dn)            16     g4dn.2xlarge  ONLY where nothing better
  #
  # gpu-16g (T4) is a last resort: it is created only in regions that offer no
  # better GPU, so it never appears next to the L4/A10G/L40S pools.

  GpuNodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: GpuEnabled
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: platforma
                Value: !Ref ClusterName
          - ResourceType: volume
            Tags:
              - Key: platforma
                Value: !Ref ClusterName

  # GpuSubnetResolver resolves, per pool and per region, BOTH the GPU instance
  # type and the subnets to launch it in — the two things that vary by region.
  # Which pools EXIST is decided at parse time by the RegionHas* Conditions, so
  # the resolver is only consulted for pools whose card the region offers.
  #
  # Type: most pools map to one card (g6f/g6e/g4dn); gpu-24g may be g6 (L4) or g5
  # (A10G) depending on the region — both 24 GiB. The resolver reads the chosen
  # type from the embedded STATIC_MAP.
  #
  # Subnets: a managed node group hands its ASG every subnet it is given; if a
  # subnet's AZ does not offer the chosen type, the ASG's launch in that AZ fails
  # ("Unsupported ... not supported in your requested Availability Zone") and the
  # scale-up stalls. Offerings differ per AZ within a region, so the resolver
  # returns only the subnets in AZs that offer the pool's card (matched by
  # account-stable AZ ID). If none match it falls back to all subnets rather than
  # blocking the stack.
  #
  # Each GPU node group consumes its pool's results via
  #   InstanceTypes: [ !GetAtt GpuSubnetResolver.<AttrKey>Type ]
  #   Subnets: !Split [",", !GetAtt GpuSubnetResolver.<AttrKey>Subnets]
  # keeping the template region- and AZ-agnostic. Refresh the embedded map with
  # generate-gpu-map.sh; a stack update re-runs the resolver.
  GpuSubnetResolverRole:
    Type: AWS::IAM::Role
    Condition: GpuEnabled
    Properties:
      RoleName: !Sub '${ClusterName}-${AWS::Region}-gpu-subnet-resolver'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeEc2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only region-scoped describe; maps subnets to their AZ IDs so
              # the resolver can filter each pool's subnets by the AZs offering its
              # card. Does not support resource-level permissions.
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                Resource: '*'
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  GpuSubnetResolverFunction:
    Type: AWS::Lambda::Function
    Condition: GpuEnabled
    Properties:
      FunctionName: !Sub '${ClusterName}-gpu-subnet-resolver'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt GpuSubnetResolverRole.Arn
      Timeout: 30
      Tags:
        - Key: platforma
          Value: !Ref ClusterName
      Code:
        ZipFile: |
          import boto3, json, os, urllib.request
          # STATIC_MAP is the committed region -> GPU-pool map, embedded here so
          # the template stays a single self-contained file. Generated (and this
          # block rewritten) by generate-gpu-map.sh from live EC2 offerings; the
          # standalone gpu-instance-map.json is the human-auditable copy. Shape:
          #   {"poolMemGib": {pool: gib},
          #    "regions": {region: {pool: {"type": t, "azIds": [azId, ...]}}}}
          # A pool is present only where its real GPU card is offered, and its node
          # group is gated by a matching RegionHas* Condition — so every pool this
          # resolver is asked about exists in the region's map.
          # AZ IDs (euw2-az1) are account-stable, unlike AZ names (eu-west-2a).
          # BEGIN GENERATED GPU MAP (generate-gpu-map.sh) — do not edit by hand
