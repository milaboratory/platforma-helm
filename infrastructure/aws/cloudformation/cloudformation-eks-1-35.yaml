"},"gpu-3g":{"azIds":["use2-az1","use2-az2","use2-az3"],"memGib":3,"type":"g6f.xlarge"},"gpu-48g":{"azIds":["use2-az1","use2-az2","use2-az3"],"memGib":48,"type":"g6e.2xlarge"},"gpu-6g":{"azIds":["use2-az1","use2-az2","use2-az3"],"memGib":6,"type":"g6f.2xlarge"},"gpu-96g":{"azIds":["use2-az1","use2-az2","use2-az3"],"memGib":48,"type":"g6e.12xlarge"}}},"us-west-1":{"gpuMax":{"cpu":6,"gpuGi":16,"ramGi":32},"pools":{"gpu-16g":{"azIds":["usw1-az1","usw1-az3"],"memGib":16,"type":"g4dn.2xlarge"}}},"us-west-2":{"gpuMax":{"cpu":46,"gpuGi":48,"ramGi":384},"pools":{"gpu-12g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":12,"type":"g6f.4xlarge"},"gpu-24g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":24,"type":"g6.2xlarge"},"gpu-3g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":3,"type":"g6f.xlarge"},"gpu-48g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":48,"type":"g6e.2xlarge"},"gpu-6g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":6,"type":"g6f.2xlarge"},"gpu-96g":{"azIds":["usw2-az1","usw2-az2","usw2-az3","usw2-az4"],"memGib":48,"type":"g6e.12xlarge"}}}}}''')
          # END GENERATED GPU MAP
          def _eks_alloc_ram_gib(cap_gib):
            # The GPU map's ramGi is the instance's RAM *capacity*. A GPU job is
            # clamped to this value, but a pod requesting full capacity never
            # schedules (kubelet kube-reserved + eviction). Convert to allocatable
            # using EKS's tiered kube-reserved memory formula (same one the EKS AL2
            # AMI applies) plus the 100Mi hard-eviction threshold, floored to GiB so
            # the ceiling is always <= a real node's allocatable. Reserve is ~4% on
            # 384GiB nodes, ~11% on 32GiB nodes — a flat margin would be wrong.
            mib = int(cap_gib) * 1024
            r = min(mib, 4096) * 0.25
            r += max(0, min(mib, 8192) - 4096) * 0.20
            r += max(0, min(mib, 16384) - 8192) * 0.10
            r += max(0, min(mib, 131072) - 16384) * 0.06
            r += max(0, mib - 131072) * 0.02
            r += 100
            return max(0, int((mib - r) // 1024))
          def handler(event, context):
            pid = 'gpu-subnet-resolver'
            try:
              if event['RequestType'] == 'Delete':
                send(event, 'SUCCESS', {}, pid)
                return
              props = event['ResourceProperties']
              subnet_ids = props['SubnetIds']
              # {AttrKey: pool}, e.g. {"Gpu3g": "gpu-3g"}. AttrKey must be dot-free
              # so node groups can !GetAtt <AttrKey>Type / <AttrKey>Subnets.
              pools = props['Pools']
              region = os.environ['AWS_REGION']
              ec2 = boto3.client('ec2')
              # subnet -> AZ ID. AZ IDs are account-stable, so they match the
              # STATIC_MAP keys regardless of which account this stack runs in.
              azid_by_subnet = {}
              for s in ec2.describe_subnets(SubnetIds=subnet_ids)['Subnets']:
                azid_by_subnet[s['SubnetId']] = s['AvailabilityZoneId']
              region_map = STATIC_MAP.get('regions', {}).get(region, {})
              pools_map = region_map.get('pools', {})
              # Per-region GPU job ceilings, from the region's highest-VRAM GPU
              # node (one real node, so cpu/ram/vram are self-consistent).
              # Consumed by the deployer as the backend's --k8s-gpu-max-cpu-request
              # / --k8s-gpu-max-ram-request and the kueue gpuMemory. Strings so CF
              # env vars can pass them verbatim.
              gpu_max = region_map.get('gpuMax', {})
              data = {}
              data['GpuMaxCpu'] = str(gpu_max.get('cpu', 0))
              # ramGi in the map is capacity; clamp GPU jobs to node *allocatable*.
              data['GpuMaxRamGi'] = str(_eks_alloc_ram_gib(gpu_max.get('ramGi', 0)))
              data['GpuMaxGpuGi'] = str(gpu_max.get('gpuGi', 0))
              for attr, pool in pools.items():
                pick = pools_map.get(pool)
                if not pick:
                  # Pool not offered in this region; its node group is disabled by
                  # a false RegionHas* Condition, so these outputs are never read.
                  data[attr + 'Type'] = ''
                  data[attr + 'Subnets'] = ','.join(subnet_ids)
                  continue
                azids = set(pick['azIds'])
                keep = [sid for sid in subnet_ids if azid_by_subnet.get(sid) in azids]
                if not keep:
                  print(f'WARNING: {pick["type"]} ({pool}) offered in none of '
                        f'{sorted(set(azid_by_subnet.values()))}; using all subnets')
                  keep = list(subnet_ids)
                data[attr + 'Type'] = pick['type']
                data[attr + 'Subnets'] = ','.join(keep)
              print('resolved GPU pools: ' + json.dumps(data))
              send(event, 'SUCCESS', data, pid)
            except Exception as e:
              print(f'ERROR: {e}')
              # Guard the last-resort send: if the PUT to the CloudFormation
              # ResponseURL fails, log it rather than dying with an uncaught
              # exception (which would leave the stack waiting on the resource
              # timeout instead of failing fast).
              try:
                send(event, 'FAILED', {'Error': str(e)}, pid)
              except Exception as send_err:
                print(f'ERROR sending FAILED response: {send_err}')
          def send(event, status, data, physical_id):
            body = json.dumps({
              'Status': status,
              'Reason': 'See CloudWatch Logs',
              'PhysicalResourceId': physical_id,
              'StackId': event['StackId'],
              'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'],
              'Data': data,
            })
            req = urllib.request.Request(
              event['ResponseURL'], data=body.encode(), method='PUT',
              headers={'Content-Type': ''})
            urllib.request.urlopen(req)

  GpuSubnetResolver:
    Type: AWS::CloudFormation::CustomResource
    Condition: GpuEnabled
    Properties:
      ServiceToken: !GetAtt GpuSubnetResolverFunction.Arn
      # CF re-invokes this resource whenever any property changes, so subnet
      # changes re-resolve automatically. A plain stack update also re-runs it,
      # which re-reads the embedded static map — how to pick up offering changes
      # after a map refresh (regenerate with generate-gpu-map.sh).
      SubnetIds: !If
        - CreateNewVpc
        - - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PrivateSubnet3
        - !Ref PrivateSubnetIds
      # AttrKey -> pool name. Each AttrKey yields two GpuSubnetResolver attributes:
      # <AttrKey>Type (the region's instance type for that pool) and
      # <AttrKey>Subnets (subnets in AZs that offer it), consumed by the matching
      # node group. Keep AttrKeys dot-free so the short !GetAtt form resolves.
      # Pool names must match STATIC_MAP. A node group only reads these when its
      # RegionHas* Condition is true, i.e. when the pool exists in the region.
      Pools:
        Gpu3g: gpu-3g
        Gpu6g: gpu-6g
        Gpu12g: gpu-12g
        Gpu16g: gpu-16g
        Gpu24g: gpu-24g
        Gpu48g: gpu-48g
        Gpu96g: gpu-96g

  # GPU node group names carry a "-v2" suffix (like system-v4 / ui-v2 / batch-*-v2).
  # InstanceTypes and Subnets are immutable on AWS::EKS::Nodegroup, and both now come
  # from GpuSubnetResolver, so changing them forces replacement. A replacement that
  # keeps the same NodegroupName fails create-before-delete with a 409 "already exists"
  # (the un-suffixed gpu-3g pools of pre-4.2.0 stacks hit exactly this). The suffix
  # lets CloudFormation create the new pool under a fresh name, then delete the old.
  Gpu3gNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: Batch16c64gNodeGroupV2
    Condition: Gpu3gEnabled
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: gpu-3g-v2
      Version: !FindInMap [Constants, EKS, Version]
      NodeRole: !GetAtt NodeGroupRole.Arn
      AmiType: AL2023_x86_64_NVIDIA
      InstanceTypes:
        - !GetAtt GpuSubnetResolver.Gpu3gType
      CapacityType: ON_DEMAND
      ScalingConfig:
        DesiredSize: 0
        MinSize: 0
        MaxSize: !FindInMap [DeploymentSize, !Ref DeploymentSize, MaxGpu3g]
      Subnets: !Split [",", !GetAtt GpuSubnetResolver.Gpu3gSubnets]
      LaunchTemplate:
        Id: !Ref GpuNodeLaunchTemplate
        Version: !GetAtt GpuNodeLaunchTemplate.LatestVersionNumber
      Labels:
        platforma.bio/gpu-memory-gib: "3"
      Taints:
        - Key: nvidia.com/gpu
          Value: present
          Effect: NO_SCHEDULE
        - Key: nvidia.com/gpu-not-ready
          Value: "true"
          Effect: NO_SCHEDULE
      Tags:
        nodegroup-type: gpu-3g
        k8s.io/cluster-autoscaler/node-template/label/platforma.bio/gpu-memory-gib: "3"
        platforma: !Sub "${ClusterName}"

