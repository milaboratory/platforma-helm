,"memGib":48,"type":"g6e.12xlarge"}}},"ap-southeast-1":{"gpuMax":{"cpu":6,"gpuGi":16,"ramGi":32},"pools":{"gpu-16g":{"azIds":["apse1-az1","apse1-az2","apse1-az3"],"memGib":16,"type":"g4dn.2xlarge"}}},"ap-southeast-2":{"gpuMax":{"cpu":6,"gpuGi":24,"ramGi":32},"pools":{"gpu-12g":{"azIds":["apse2-az1","apse2-az2"],"memGib":12,"type":"g6f.4xlarge"},"gpu-24g":{"azIds":["apse2-az1","apse2-az2","apse2-az3"],"memGib":24,"type":"g6.2xlarge"},"gpu-3g":{"azIds":["apse2-az1","apse2-az2"],"memGib":3,"type":"g6f.xlarge"},"gpu-6g":{"azIds":["apse2-az1","apse2-az2"],"memGib":6,"type":"g6f.2xlarge"}}},"ca-central-1":{"gpuMax":{"cpu":6,"gpuGi":24,"ramGi":32},"pools":{"gpu-12g":{"azIds":["cac1-az1","cac1-az2"],"memGib":12,"type":"g6f.4xlarge"},"gpu-24g":{"azIds":["cac1-az1","cac1-az2","cac1-az4"],"memGib":24,"type":"g6.2xlarge"},"gpu-3g":{"azIds":["cac1-az1","cac1-az2"],"memGib":3,"type":"g6f.xlarge"},"gpu-6g":{"azIds":["cac1-az1","cac1-az2"],"memGib":6,"type":"g6f.2xlarge"}}},"eu-central-1":{"gpuMax":{"cpu":46,"gpuGi":48,"ramGi":384},"pools":{"gpu-12g":{"azIds":["euc1-az2","euc1-az3"],"memGib":12,"type":"g6f.4xlarge"},"gpu-24g":{"azIds":["euc1-az1","euc1-az2","euc1-az3"],"memGib":24,"type":"g6.2xlarge"},"gpu-3g":{"azIds":["euc1-az2","euc1-az3"],"memGib":3,"type":"g6f.xlarge"},"gpu-48g":{"azIds":["euc1-az1","euc1-az2","euc1-az3"],"memGib":48,"type":"g6e.2xlarge"},"gpu-6g":{"azIds":["euc1-az2","euc1-az3"],"memGib":6,"type":"g6f.2xlarge"},"gpu-96g":{"azIds":["euc1-az1","euc1-az2","euc1-az3"],"memGib":48,"type":"g6e.12xlarge"}}},"eu-north-1":{"gpuMax":{"cpu":46,"gpuGi":48,"ramGi":384},"pools":{"gpu-12g":{"azIds":["eun1-az1","eun1-az2"],"memGib":12,"type":"g6f.4xlarge"},"gpu-24g":{"azIds":["eun1-az1","eun1-az2"],"memGib":24,"type":"g6.2xlarge"},"gpu-3g":{"azIds":["eun1-az1","eun1-az2"],"memGib":3,"type":"g6f.xlarge"},"gpu-48g":{"azIds":["eun1-az1","eun1-az2"],"memGib":48,"type":"g6e.2xlarge"},"gpu-6g":{"azIds":["eun1-az1","eun1-az2"],"memGib":6,"type":"g6f.2xlarge"},"gpu-96g":{"azIds":["e