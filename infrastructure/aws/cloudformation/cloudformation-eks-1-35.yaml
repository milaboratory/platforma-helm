  # gpu-16g is the T4 (g4dn) last-resort pool: created (via Gpu16gEnabled) ONLY in
  # regions that offer no better GPU than T4, so it never appears alongside the
  # L4/A10G/L40S pools. 16 GiB per-GPU VRAM.
  Gpu16gNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: Batch16c64gNodeGroupV2
    Condition: Gpu16gEnabled
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: gpu-16g-v2
      Version: !FindInMap [Constants, EKS, Version]
      NodeRole: !GetAtt NodeGroupRole.Arn
      AmiType: AL2023_x86_64_NVIDIA
      InstanceTypes:
        - !GetAtt GpuSubnetResolver.Gpu16gType
      CapacityType: ON_DEMAND
      ScalingConfig:
        DesiredSize: 0
        MinSize: 0
        MaxSize: !FindInMap [DeploymentSize, !Ref DeploymentSize, MaxGpu16g]
      Subnets: !Split [",", !GetAtt GpuSubnetResolver.Gpu16gSubnets]
      LaunchTemplate:
        Id: !Ref GpuNodeLaunchTemplate
        Version: !GetAtt GpuNodeLaunchTemplate.LatestVersionNumber
      Labels:
        platforma.bio/gpu-memory-gib: "16"
      Taints:
        - Key: nvidia.com/gpu
          Value: present
          Effect: NO_SCHEDULE
        - Key: nvidia.com/gpu-not-ready
          Value: "true"
          Effect: NO_SCHEDULE
      Tags:
        nodegroup-type: gpu-16g
        k8s.io/cluster-autoscaler/node-template/label/platforma.bio/gpu-memory-gib: "16"
        platforma: !Sub "${ClusterName}"

  # ---------------------------------------------------------------------------
  # 5. EKS managed addons
  # ---------------------------------------------------------------------------

  # Core networking addons — takes over from EKS auto-installed self-managed
  # versions, giving version governance and automatic upgrade compatibility.
  VpcCniAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroupV5
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  # CSI drivers (DependsOn: SystemNodeGroupV5 for running pods)
  EbsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroupV5
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: aws-ebs-csi-driver
      ServiceAccountRoleArn: !GetAtt EbsCsiDriverRole.Arn
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  EfsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroupV5
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: aws-efs-csi-driver
      ServiceAccountRoleArn: !GetAtt EfsCsiDriverRole.Arn
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  # metrics-server — required for HorizontalPodAutoscaler and `kubectl top`.
  # GKE bundles it by default; EKS does not. The EKS-managed addon installs
  # the upstream kubernetes-sigs/metrics-server (no IAM role needed — it's
  # an in-cluster component reading the kubelet metrics API).
  #
  # ResolveConflicts: OVERWRITE is the right choice for THIS template because
  # this CF is the greenfield/quickstart installer — it creates the EKS
  # cluster fresh, so there is no pre-existing operator-managed metrics-server
  # to clobber. Operators integrating Platforma into a pre-existing cluster
  # should follow advanced-installation.md (manual Helm install), NOT re-apply
  # this CF on top of their cluster — see the README "When to use this path"
  # section.
  MetricsServerAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroupV5
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: metrics-server
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  # ---------------------------------------------------------------------------
  # 5b. Helm deployer — two CodeBuild projects + shared Lambda trigger
  #     HelmDeployerProject:          infra controllers (Kueue, AppWrapper,
  #                                   Autoscaler, ExternalDNS, ALB). Keeps
  #                                   the existing project name for in-place
  #                                   update on existing stacks.
  #     PlatformaDeployerProject:     Platforma only.
  #     One shared Lambda reads CodeBuildProject from event ResourceProperties
  #     to know which project to start. One shared IAM role for both projects.
  #     TriggerPlatformaDeploy DependsOn TriggerHelmDeploy (infra first).
  # ---------------------------------------------------------------------------

  HelmDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-${AWS::Region}-helm-deployer'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: HelmDeployerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:PutRetentionPolicy
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ClusterName}-helm-deployer:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ClusterName}-platforma-deployer:*'
              # Store/retrieve auto-generated users password in SSM Parameter Store
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ClusterName}/platforma/*'
              # Teardown: delete ALBs, TGs, and SGs that ALB Controller created outside CF
              - Effect: Allow
                Action:
                  - tag:GetResources
                Resource: '*'
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                Resource:
                  - !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*/*'
                  - !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*/*'
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource: '*'
              - Effect: Allow
                Action:
                  - servicequotas:GetServiceQuota
                Resource: '*'
              # Pull Helm charts and container images from ECR (needed when PlatformaHelmChart or PlatformaImage point to ECR)
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                # Region wildcard: custom PlatformaHelmChart/PlatformaImage may live in a
                # different region than the cluster (e.g. an eu-central-1 chart on an eu-west-1 cluster).
                Resource: !Sub 'arn:aws:ecr:*:${AWS::AccountId}:repository/*'
              # Tag GPU ASGs for Cluster Autoscaler scale-from-zero
              - Effect: Allow
                Action:
                  - autoscaling:CreateOrUpdateTags
                  - autoscaling:DescribeTags
                  - autoscaling:DescribeAutoScalingGroups
                  - eks:ListNodegroups
                  - eks:DescribeNodegroup
                Resource: '*'
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  HelmDeployerAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !GetAtt HelmDeployerRole.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  # IMPORTANT: This CodeBuild project runs on the public internet and connects
  # to the EKS API via the public endpoint (EndpointPublicAccess: true).
  # If you restrict the cluster to private-only access, you must add a VpcConfig
  # to this project (security group, subnets, NAT Gateway route).
  HelmDeployerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ClusterName}-helm-deployer'
      ServiceRole: !GetAtt HelmDeployerRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: CLUSTER_NAME
            Value: !Ref ClusterName
          - Name: REGION
            Value: !Ref AWS::Region
          - Name: NAMESPACE
            Value: !Ref PlatformaNamespace
          - Name: AUTOSCALER_ROLE_ARN
            Value: !GetAtt AutoscalerIrsaRole.Arn
          - Name: VPC_ID
            Value: !If [CreateNewVpc, !Ref Vpc, !Ref VpcId]
          - Name: ALB_ROLE_ARN
            Value: !GetAtt ALBControllerRole.Arn
          - Name: EXTERNALDNS_ROLE_ARN
            Value: !GetAtt ExternalDNSRole.Arn
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          - Name: KUBERNETES_VERSION
            Value: !FindInMap [Constants, EKS, Version]
          # -----------------------------------------------------------------
          # INFRA VERSIONS — duplicated in TriggerHelmDeploy properties.
          # When changing any version below, also update TriggerHelmDeploy.
          # -----------------------------------------------------------------
          - Name: KUEUE_VERSION
            Value: '0.16.1'
          - Name: APPWRAPPER_VERSION
            Value: 'v1.2.0'
          - Name: CLUSTER_AUTOSCALER_CHART_VERSION
            Value: '9.56.0'
          - Name: EXTERNAL_DNS_VERSION
            Value: '1.20.0'
          - Name: ALB_CONTROLLER_VERSION
            Value: '3.0.0'
      Tags:
        - Key: platforma
          Value: !Ref ClusterName
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                # Install kubectl
                - curl -sLO "https://dl.k8s.io/release/v${KUBERNETES_VERSION}.0/bin/linux/amd64/kubectl"
                - chmod +x kubectl && mv kubectl /usr/local/bin/
                # Install Helm
                - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
                # Configure kubeconfig
                - aws eks update-kubeconfig --name $CLUSTER_NAME --region $REGION
            build:
              commands:
                # Build phase: 6 blocks, each with its own CloudWatch log section.
                # Block 0 = teardown; blocks 1-5 = install steps.
                # CodeBuild stops automatically on the first block that fails.

                # --- Block 0: TEARDOWN (exits 0 immediately when TEARDOWN=false) ---
                - |
                  [ "${TEARDOWN:-false}" != "true" ] && exit 0
                  echo "=== INFRA TEARDOWN ==="
                  helm uninstall aws-load-balancer-controller -n $NAMESPACE --ignore-not-found --wait --timeout 3m || true
                  echo "Waiting 30s for External DNS to sync DNS record deletion..."
                  sleep 30
                  helm uninstall external-dns -n $NAMESPACE --ignore-not-found --wait --timeout 3m || true
                  helm uninstall cluster-autoscaler -n $NAMESPACE --ignore-not-found --wait --timeout 3m || true
                  helm uninstall kueue -n kueue-system --ignore-not-found --wait --timeout 3m || true
                  kubectl delete appwrappers --all -A --ignore-not-found || true
                  kubectl delete -f https://github.com/project-codeflare/appwrapper/releases/download/$APPWRAPPER_VERSION/install.yaml \
                    --ignore-not-found || true
                  echo "Infra teardown complete."
                  exit 0

                # --- Block 1: LOG RETENTION ---
                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  echo "=== [1/5] LOG RETENTION ==="
                  aws logs put-retention-policy --log-group-name "/aws/codebuild/${CLUSTER_NAME}-helm-deployer" --retention-in-days 30 --region $REGION 2>/dev/null || true
                  aws logs put-retention-policy --log-group-name "/aws/codebuild/${CLUSTER_NAME}-platforma-deployer" --retention-in-days 30 --region $REGION 2>/dev/null || true
                  aws logs put-retention-policy --log-group-name "/aws/lambda/${CLUSTER_NAME}-helm-trigger" --retention-in-days 14 --region $REGION 2>/dev/null || true

                # --- Block 2: KUEUE + APPWRAPPER ---
                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  echo "=== [2/5] KUEUE + APPWRAPPER ==="
                  kubectl apply --server-side -f https://raw.githubusercontent.com/kubernetes/autoscaler/cluster-autoscaler-${KUBERNETES_VERSION}.0/cluster-autoscaler/apis/config/crd/autoscaling.x-k8s.io_provisioningrequests.yaml
                  helm upgrade --install kueue oci://registry.k8s.io/kueue/charts/kueue \
                    --version $KUEUE_VERSION \
                    -n kueue-system --create-namespace \
                    --set controllerManager.manager.resources.limits.cpu=500m \
                    --set controllerManager.manager.resources.limits.memory=1Gi \
                    --set controllerManager.manager.resources.requests.cpu=100m \
                    --set controllerManager.manager.resources.requests.memory=512Mi \
                    --set featureGates.AppWrapper=true \
                    --set featureGates.ProvisioningACC=true \
                    --set 'integrations.frameworks[0]=batch/job' \
                    --set 'integrations.frameworks[1]=jobset.x-k8s.io/jobset' \
                    --set 'integrations.frameworks[2]=workload.codeflare.dev/appwrapper' \
                    --set 'integrations.podOptions.namespaceSelector.matchExpressions[0].key=kubernetes.io/metadata.name' \
                    --set 'integrations.podOptions.namespaceSelector.matchExpressions[0].operator=NotIn' \
                    --set 'integrations.podOptions.namespaceSelector.matchExpressions[0].values[0]=kube-system' \
                    --set 'integrations.podOptions.namespaceSelector.matchExpressions[0].values[1]=kueue-system' \
                    --set metrics.enableClusterQueueResources=true \
                    --atomic --timeout 5m
                  # Restart Kueue if the ProvisioningRequest CRD was just installed —
                  # Kueue only discovers CRDs at startup and skips the provisioning
                  # controller if the CRD wasn't present when it first started.
                  kubectl rollout restart deployment kueue-controller-manager -n kueue-system
                  kubectl wait --for=condition=Available deployment/kueue-controller-manager -n kueue-system --timeout=120s
                  # Verify AppWrapper install.yaml integrity before applying.
                  # A compromised release tag, MITM in transit, or a silent
                  # upstream re-tag would change the SHA-256 and fail this
                  # check before kubectl apply touches the cluster. Update
                  # APPWRAPPER_INSTALL_YAML_SHA256 alongside APPWRAPPER_VERSION;
                  # compute with: curl -fsSL <url> | sha256sum.
                  APPWRAPPER_INSTALL_YAML_SHA256="aabb84a8719248c1dfaa6516f194dce559043237657cc697823f61ebeeaf9024"
                  APPWRAPPER_INSTALL_YAML_TMP="$(mktemp)"
                  curl -fsSL "https://github.com/project-codeflare/appwrapper/releases/download/$APPWRAPPER_VERSION/install.yaml" -o "$APPWRAPPER_INSTALL_YAML_TMP"
                  ACTUAL_SHA="$(sha256sum "$APPWRAPPER_INSTALL_YAML_TMP" | awk '{print $1}')"
                  if [ "$ACTUAL_SHA" != "$APPWRAPPER_INSTALL_YAML_SHA256" ]; then
                    echo "ERROR: AppWrapper install.yaml SHA-256 mismatch — got $ACTUAL_SHA, expected $APPWRAPPER_INSTALL_YAML_SHA256." >&2
                    echo "       Either upstream re-published $APPWRAPPER_VERSION (verify and update APPWRAPPER_INSTALL_YAML_SHA256) or the download was tampered with." >&2
                    rm -f "$APPWRAPPER_INSTALL_YAML_TMP"
                    exit 1
                  fi
                  kubectl apply --server-side -f "$APPWRAPPER_INSTALL_YAML_TMP"
                  rm -f "$APPWRAPPER_INSTALL_YAML_TMP"
                  kubectl wait --for=condition=Available deployment/appwrapper-controller-manager -n appwrapper-system --timeout=120s
                  kubectl delete validatingwebhookconfiguration appwrapper-validating-webhook-configuration --ignore-not-found
                  kubectl delete mutatingwebhookconfiguration appwrapper-mutating-webhook-configuration --ignore-not-found

                # --- Block 3: CLUSTER AUTOSCALER ---
                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  echo "=== [3/5] CLUSTER AUTOSCALER ==="
                  helm repo add autoscaler https://kubernetes.github.io/autoscaler
                  helm repo update
                  helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
                    --version $CLUSTER_AUTOSCALER_CHART_VERSION \
                    --set image.tag=v$KUBERNETES_VERSION.0 \
                    -n $NAMESPACE --create-namespace \
                    --set autoDiscovery.clusterName=$CLUSTER_NAME \
                    --set awsRegion=$REGION \
                    --set rbac.serviceAccount.create=true \
                    --set rbac.serviceAccount.name=cluster-autoscaler \
                    --set "rbac.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$AUTOSCALER_ROLE_ARN" \
                    --set "autoDiscovery.tags[0]=eks:cluster-name=$CLUSTER_NAME" \
                    --set extraArgs.scale-down-delay-after-add=5m \
                    --set extraArgs.scale-down-unneeded-time=5m \
                    --set extraArgs.scale-down-utilization-threshold=0.5 \
                    --set extraArgs.expander=least-waste \
                    --set extraArgs.max-node-provision-time=5m \
                    --set extraArgs.initial-node-group-backoff-duration=1m \
                    --set extraArgs.max-node-group-backoff-duration=5m \
                    --set extraArgs.enable-provisioning-requests=true \
                    --set extraArgs.kube-api-content-type=application/json \
                    --set extraArgs.startup-taint=nvidia.com/gpu-not-ready \
                    --atomic --timeout 5m

                  # Grant CA access to ProvisioningRequest and PodTemplate resources.
                  # roleRef is immutable on a ClusterRoleBinding: if an earlier install
                  # (e.g. manual "provisioning-request-admin" role from pre-3.2.x testing)
                  # bound this name to a different ClusterRole, `kubectl apply` fails with
                  # "cannot change roleRef". Recreate the binding when roleRef drifts, and
                  # drop the legacy orphan ClusterRole.
                  EXPECTED_ROLE="cluster-autoscaler-provisioning-requests"
                  CURRENT_ROLE=$(kubectl get clusterrolebinding cluster-autoscaler-provisioning-requests \
                    -o jsonpath='{.roleRef.name}' 2>/dev/null || true)
                  if [ -n "$CURRENT_ROLE" ] && [ "$CURRENT_ROLE" != "$EXPECTED_ROLE" ]; then
                    echo "Recreating stale ClusterRoleBinding (was bound to $CURRENT_ROLE)"
                    kubectl delete clusterrolebinding cluster-autoscaler-provisioning-requests
                  fi
                  kubectl delete clusterrole provisioning-request-admin --ignore-not-found
                  kubectl apply -f - <<RBAC
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: cluster-autoscaler-provisioning-requests
                  rules:
                    - apiGroups: ["autoscaling.x-k8s.io"]
                      resources: ["provisioningrequests", "provisioningrequests/status"]
                      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                    - apiGroups: [""]
                      resources: ["podtemplates"]
                      verbs: ["get", "list", "watch"]
                  ---
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: cluster-autoscaler-provisioning-requests
                  subjects:
                    - kind: ServiceAccount
                      name: cluster-autoscaler
                      namespace: $NAMESPACE
                  roleRef:
                    kind: ClusterRole
                    name: cluster-autoscaler-provisioning-requests
                    apiGroup: rbac.authorization.k8s.io
                  RBAC

                  # Tag GPU ASGs with nvidia.com/gpu resource for scale-from-zero.
                  # EKS Nodegroup Tags don't propagate to ASGs, but the Cluster Autoscaler
                  # reads ASG tags to build node templates when scaling from zero.
                  # Without this tag, CA can't determine GPU capacity and skips GPU node groups.
                  for NG_NAME in $(aws eks list-nodegroups --cluster-name $CLUSTER_NAME --region $REGION --query 'nodegroups[?contains(@, `gpu`)]' --output text); do
                    NG_LABELS=$(aws eks describe-nodegroup --cluster-name $CLUSTER_NAME --nodegroup-name $NG_NAME --region $REGION --query 'nodegroup.labels' --output json 2>/dev/null)
                    GPU_GIB=$(echo "$NG_LABELS" | jq -r '.["platforma.bio/gpu-memory-gib"] // empty')
                    if [ -n "$GPU_GIB" ]; then
                      ASG_NAME=$(aws eks describe-nodegroup --cluster-name $CLUSTER_NAME --nodegroup-name $NG_NAME --region $REGION --query 'nodegroup.resources.autoScalingGroups[0].name' --output text)
                      echo "Tagging ASG $ASG_NAME (nodegroup $NG_NAME) with gpu-memory-gib=$GPU_GIB and nvidia.com/gpu=1"
                      aws autoscaling create-or-update-tags --tags \
                        "ResourceId=$ASG_NAME,ResourceType=auto-scaling-group,Key=k8s.io/cluster-autoscaler/node-template/label/platforma.bio/gpu-memory-gib,Value=$GPU_GIB,PropagateAtLaunch=true" \
                        "ResourceId=$ASG_NAME,ResourceType=auto-scaling-group,Key=k8s.io/cluster-autoscaler/node-template/resources/nvidia.com/gpu,Value=1,PropagateAtLaunch=true" \
                        "ResourceId=$ASG_NAME,ResourceType=auto-scaling-group,Key=k8s.io/cluster-autoscaler/node-template/taint/nvidia.com/gpu,Value=present:NoSchedule,PropagateAtLaunch=true" \
                        --region $REGION
                    fi
                  done

                # --- Block 4: EXTERNAL DNS (before ALB to avoid mutating webhook race) ---
                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  echo "=== [4/5] EXTERNAL DNS ==="
                  helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
                  helm repo update
                  helm upgrade --install external-dns external-dns/external-dns \
                    --version $EXTERNAL_DNS_VERSION \
                    -n $NAMESPACE --create-namespace \
                    --set policy=sync \
                    --set registry=txt \
                    --set txtOwnerId=$CLUSTER_NAME \
                    --set "extraArgs[0]=--zone-id-filter=$HOSTED_ZONE_ID" \
                    --set serviceAccount.create=true \
                    --set serviceAccount.name=external-dns \
                    --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$EXTERNALDNS_ROLE_ARN" \
                    --atomic --timeout 3m

                # --- Block 5: ALB CONTROLLER + WEBHOOK PROBE ---
                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  echo "=== [5/5] ALB CONTROLLER ==="
                  helm repo add eks https://aws.github.io/eks-charts
                  helm repo update
                  helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
                    --version $ALB_CONTROLLER_VERSION \
                    -n $NAMESPACE --create-namespace \
                    --set clusterName=$CLUSTER_NAME \
                    --set region=$REGION \
                    --set serviceAccount.create=true \
                    --set serviceAccount.name=aws-load-balancer-controller \
                    --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN" \
                    --set vpcId=$VPC_ID \
                    --set replicaCount=1 \
                    --atomic --timeout 5m
                  kubectl rollout status deployment/aws-load-balancer-controller -n $NAMESPACE --timeout=120s
                  cat > /tmp/alb-probe.yaml << 'PROBE'
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: alb-webhook-probe
                    namespace: default
                    annotations:
                      alb.ingress.kubernetes.io/scheme: internal
                  spec:
                    ingressClassName: alb
                    rules:
                      - http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: probe
                                  port:
                                    number: 80
                  PROBE
                  echo "Waiting for ALB webhook to become ready..."
                  for i in $(seq 1 30); do
                    if kubectl create -f /tmp/alb-probe.yaml --dry-run=server 2>/dev/null; then
                      echo "  ALB webhook ready."
                      break
                    fi
                    echo "  Webhook not ready, retrying... ($((i * 5))s elapsed)"
                    sleep 5
                  done
            post_build:
              commands:
                - |
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
                    STATUS="SUCCESS"
                    REASON="Infra controllers deployed successfully"
                  else
                    STATUS="FAILED"
                    REASON="Infra deployment failed. Check CodeBuild logs: $CODEBUILD_BUILD_ID"
                  fi
                  PHYSICAL_ID="${CLUSTER_NAME}-helm-deployer"
                  curl -s -X PUT -H "Content-Type: " \
                    -d "{\"Status\":\"$STATUS\",\"Reason\":\"$REASON\",\"PhysicalResourceId\":\"$PHYSICAL_ID\",\"StackId\":\"$CFN_STACK_ID\",\"RequestId\":\"$CFN_REQUEST_ID\",\"LogicalResourceId\":\"$CFN_LOGICAL_ID\",\"Data\":{}}" \
                    "$CFN_RESPONSE_URL"

  PlatformaDeployerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ClusterName}-platforma-deployer'
      ServiceRole: !GetAtt HelmDeployerRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: CLUSTER_NAME
            Value: !Ref ClusterName
          - Name: REGION
            Value: !Ref AWS::Region
          - Name: NAMESPACE
            Value: !Ref PlatformaNamespace
          - Name: KUBERNETES_VERSION
            Value: !FindInMap [Constants, EKS, Version]
          # NOTE: Secrets below are visible in CodeBuild console/API.
          # The auto-generated users password uses SSM SecureString (see buildspec).
          # For user-provided secrets, restrict codebuild:BatchGetBuilds/BatchGetProjects
          # IAM permissions to trusted roles only.
          - Name: LICENSE_KEY
            Value: !Ref LicenseKey
            Type: PLAINTEXT
          - Name: PLATFORMA_VERSION
            Value: !If
              - UseDefaultPlatformaVersion
              - !FindInMap [Constants, Platforma, Version]
              - !Ref PlatformaVersion
          - Name: PLATFORMA_IMAGE
            Value: !Ref PlatformaImage
          - Name: PLATFORMA_HELM_CHART
            Value: !If
              - UseDefaultHelmChart
              - 'oci://ghcr.io/milaboratory/platforma-helm/platforma'
              - !Ref PlatformaHelmChart
          - Name: DEPLOY_PLATFORMA
            Value: !Ref DeployPlatforma
          - Name: DOMAIN_NAME
            Value: !Ref DomainName
          - Name: CERTIFICATE_ARN
            Value: !Ref Certificate
          - Name: EFS_FILE_SYSTEM_ID
            Value: !Ref EfsFileSystem
          - Name: S3_BUCKET
            Value: !Ref S3Bucket
          - Name: PLATFORMA_ROLE_ARN
            Value: !GetAtt PlatformaIrsaRole.Arn
          - Name: PLATFORMA_JOBS_ROLE_ARN
            Value: !GetAtt PlatformaJobsIrsaRole.Arn
          - Name: VPC_ID
            Value: !If [CreateNewVpc, !Ref Vpc, !Ref VpcId]
          - Name: DEPLOYMENT_SIZE
            Value: !Ref DeploymentSize
          - Name: UI_QUEUE_CPU
            Value: !FindInMap [DeploymentSize, !Ref DeploymentSize, UiCpu]
          - Name: UI_QUEUE_MEMORY_GI
            Value: !FindInMap [DeploymentSize, !Ref DeploymentSize, UiMemoryGi]
          - Name: BATCH_QUEUE_CPU
            Value: !FindInMap [DeploymentSize, !Ref DeploymentSize, BatchCpu]
          - Name: BATCH_QUEUE_MEMORY_GI
            Value: !FindInMap [DeploymentSize, !Ref DeploymentSize, BatchMemoryGi]
          - Name: GPU_ENABLED
            Value: !Ref EnableGpu
          # GPU job ceilings for the region's biggest GPU node (from
          # GpuSubnetResolver). Fed to the backend's --k8s-gpu-max-cpu/ram-request
          # and kueue gpuMemory so GPU jobs are shrunk to what a real GPU node in
          # this region provides. '0' when GPU is disabled (resolver absent).
          - Name: GPU_MAX_CPU
            Value: !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxCpu, '0']
          - Name: GPU_MAX_RAM_GI
            Value: !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxRamGi, '0']
          - Name: GPU_MAX_GPU_GI
            Value: !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxGpuGi, '0']
          - Name: AUTH_METHOD
            Value: !Ref AuthMethod
          - Name: SHOW_USER_LIST
            Value: !Ref ShowUserList
          - Name: ADMIN_USERS
            Value: !Ref AdminUsers
          - Name: HTPASSWD_CONTENT
            Value: !Ref HtpasswdContent
          - Name: LDAP_SERVER
            Value: !Ref LdapServer
          - Name: LDAP_START_TLS
            Value: !Ref LdapStartTLS
          - Name: LDAP_BIND_DN
            Value: !Ref LdapBindDN
          - Name: LDAP_SEARCH_RULES
            Value: !Ref LdapSearchRules
          - Name: LDAP_SEARCH_USER
            Value: !Ref LdapSearchUser
          - Name: LDAP_SEARCH_PASSWORD
            Value: !Ref LdapSearchPassword
          - Name: GOOGLE_CLIENT_ID
            Value: !Ref GoogleClientId
          - Name: GOOGLE_CLIENT_SECRET
            Value: !Ref GoogleClientSecret
          - Name: ENTRA_ISSUER
            Value: !Ref EntraIssuer
          - Name: ENTRA_TENANT_ID
            Value: !Ref EntraTenantId
          - Name: ENTRA_CLIENT_ID
            Value: !Ref EntraClientId
          - Name: ENABLE_DEMO_LIBRARY
            Value: !Ref EnableDemoLibrary
          - Name: DATA_LIBRARY_1_NAME
            Value: !Ref DataLibrary1Name
          - Name: DATA_LIBRARY_1_BUCKET
            Value: !Ref DataLibrary1Bucket
          - Name: DATA_LIBRARY_1_REGION
            Value: !Ref DataLibrary1Region
          - Name: DATA_LIBRARY_1_ACCESS_KEY
            Value: !Ref DataLibrary1AccessKey
          - Name: DATA_LIBRARY_1_SECRET_KEY
            Value: !Ref DataLibrary1SecretKey
          - Name: DATA_LIBRARY_2_NAME
            Value: !Ref DataLibrary2Name
          - Name: DATA_LIBRARY_2_BUCKET
            Value: !Ref DataLibrary2Bucket
          - Name: DATA_LIBRARY_2_REGION
            Value: !Ref DataLibrary2Region
          - Name: DATA_LIBRARY_2_ACCESS_KEY
            Value: !Ref DataLibrary2AccessKey
          - Name: DATA_LIBRARY_2_SECRET_KEY
            Value: !Ref DataLibrary2SecretKey
          - Name: DATA_LIBRARY_3_NAME
            Value: !Ref DataLibrary3Name
          - Name: DATA_LIBRARY_3_BUCKET
            Value: !Ref DataLibrary3Bucket
          - Name: DATA_LIBRARY_3_REGION
            Value: !Ref DataLibrary3Region
          - Name: DATA_LIBRARY_3_ACCESS_KEY
            Value: !Ref DataLibrary3AccessKey
          - Name: DATA_LIBRARY_3_SECRET_KEY
            Value: !Ref DataLibrary3SecretKey
      Tags:
        - Key: platforma
          Value: !Ref ClusterName
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - curl -sLO "https://dl.k8s.io/release/v${KUBERNETES_VERSION}.0/bin/linux/amd64/kubectl"
                - chmod +x kubectl && mv kubectl /usr/local/bin/
                - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
                - aws eks update-kubeconfig --name $CLUSTER_NAME --region $REGION
            build:
              commands:

                - |
                  [ "${TEARDOWN:-false}" != "true" ] && exit 0
                  echo "=== PLATFORMA TEARDOWN ==="
                  helm uninstall platforma -n $NAMESPACE --ignore-not-found --wait --timeout 8m || true
                  echo "Waiting for ALBs (elbv2.k8s.aws/cluster=$CLUSTER_NAME) to be deleted..."
                  for i in $(seq 1 60); do
                    COUNT=$(aws resourcegroupstaggingapi get-resources \
                      --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER_NAME" \
                      --resource-type-filters "elasticloadbalancing:loadbalancer" \
                      --query 'length(ResourceTagMappingList)' --output text --region $REGION 2>/dev/null || echo "0")
                    [ "$COUNT" = "0" ] && echo "  All ALBs deleted." && break
                    echo "  $COUNT ALB(s) still present, waiting... ($((i * 5))s elapsed)"
                    sleep 5
                  done
                  if [ "${COUNT:-0}" != "0" ]; then
                    echo "WARNING: $COUNT ALB(s) still present after 5 minutes. Attempting direct deletion..."
                    for ALB_ARN in $(aws resourcegroupstaggingapi get-resources \
                      --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER_NAME" \
                      --resource-type-filters "elasticloadbalancing:loadbalancer" \
                      --query 'ResourceTagMappingList[].ResourceARN' --output text --region $REGION 2>/dev/null); do
                      echo "  Deleting ALB: $ALB_ARN"
                      aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" --region $REGION || true
                    done
                    echo "  Waiting for force-deleted ALBs to vanish..."
                    for j in $(seq 1 24); do
                      REMAINING=$(aws resourcegroupstaggingapi get-resources \
                        --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER_NAME" \
                        --resource-type-filters "elasticloadbalancing:loadbalancer" \
                        --query 'length(ResourceTagMappingList)' --output text --region $REGION 2>/dev/null || echo "0")
                      [ "$REMAINING" = "0" ] && echo "  All ALBs gone." && break
                      sleep 5
                    done
                  fi
                  sleep 10
                  echo "Cleaning up ALB target groups..."
                  for TG_ARN in $(aws resourcegroupstaggingapi get-resources \
                    --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER_NAME" \
                    --resource-type-filters "elasticloadbalancing:targetgroup" \
                    --query 'ResourceTagMappingList[].ResourceARN' --output text --region $REGION 2>/dev/null); do
                    echo "  Deleting target group: $TG_ARN"
                    for t in $(seq 1 6); do
                      aws elbv2 delete-target-group --target-group-arn "$TG_ARN" --region $REGION 2>/dev/null && break
                      sleep 5
                    done
                  done
                  echo "Cleaning up ALB security groups..."
                  if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
                    ALB_SGS=$(aws ec2 describe-security-groups --region $REGION \
                      --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:elbv2.k8s.aws/cluster,Values=$CLUSTER_NAME" \
                      --query 'SecurityGroups[].GroupId' --output text 2>/dev/null || echo "")
                    for SG_ID in $ALB_SGS; do
                      echo "  Cleaning up SG $SG_ID..."
                      for RULE_ID in $(aws ec2 describe-security-group-rules --region $REGION \
                        --filters "Name=group-id,Values=$SG_ID" \
                        --query "SecurityGroupRules[?ReferencedGroupInfo].SecurityGroupRuleId" \
                        --output text 2>/dev/null); do
                        aws ec2 revoke-security-group-ingress --region $REGION \
                          --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID" 2>/dev/null || \
                        aws ec2 revoke-security-group-egress --region $REGION \
                          --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID" 2>/dev/null || true
                      done
                      for OTHER_SG in $(aws ec2 describe-security-groups --region $REGION \
                        --filters "Name=vpc-id,Values=$VPC_ID" "Name=ip-permission.group-id,Values=$SG_ID" \
                        --query 'SecurityGroups[].GroupId' --output text 2>/dev/null); do
                        for RULE_ID in $(aws ec2 describe-security-group-rules --region $REGION \
                          --filters "Name=group-id,Values=$OTHER_SG" \
                          --query "SecurityGroupRules[?ReferencedGroupInfo.GroupId=='$SG_ID'].SecurityGroupRuleId" \
                          --output text 2>/dev/null); do
                          aws ec2 revoke-security-group-ingress --region $REGION \
                            --group-id "$OTHER_SG" --security-group-rule-ids "$RULE_ID" 2>/dev/null || \
                          aws ec2 revoke-security-group-egress --region $REGION \
                            --group-id "$OTHER_SG" --security-group-rule-ids "$RULE_ID" 2>/dev/null || true
                        done
                      done
                      for k in $(seq 1 6); do
                        aws ec2 delete-security-group --group-id "$SG_ID" --region $REGION 2>/dev/null && echo "  Deleted $SG_ID" && break
                        echo "  SG $SG_ID still has dependencies, retrying... ($((k * 5))s)"
                        sleep 5
                      done
                    done
                  fi
                  aws ssm delete-parameter \
                    --name "/${CLUSTER_NAME}/platforma/users-password" \
                    --region $REGION 2>/dev/null || true
                  aws ssm delete-parameter \
                    --name "/${CLUSTER_NAME}/platforma/master-secret" \
                    --region $REGION 2>/dev/null || true
                  echo "Platforma teardown complete."
                  exit 0

                - |
                  [ "${TEARDOWN:-false}" = "true" ] && exit 0
                  [ "$DEPLOY_PLATFORMA" != "true" ] && exit 0
                  echo "=== [1/1] PLATFORMA ==="
                  echo "Checking AWS On-Demand Standard vCPU quota..."
                  VCPU_QUOTA=$(aws service-quotas get-service-quota \
                    --service-code ec2 \
                    --quota-code L-1216C47A \
                    --region $REGION \
                    --query 'Quota.Value' --output text 2>/dev/null)
                  if [ -z "$VCPU_QUOTA" ]; then
                    echo "WARNING: Could not retrieve vCPU quota (check servicequotas:GetServiceQuota permission). Skipping check."
                  else
                    VCPU_QUOTA_INT=${VCPU_QUOTA%.*}
                    VCPU_NEEDED=$((BATCH_QUEUE_CPU + UI_QUEUE_CPU))
                    if [ "$VCPU_QUOTA_INT" -lt "$VCPU_NEEDED" ]; then
                      echo "ERROR: vCPU quota ($VCPU_QUOTA_INT) < needed ($VCPU_NEEDED: batch=$BATCH_QUEUE_CPU + ui=$UI_QUEUE_CPU)."
                      echo "  Request increase: https://console.aws.amazon.com/servicequotas/home/services/ec2/quotas/L-1216C47A"
                      exit 1
                    fi
                    echo "vCPU quota OK: $VCPU_QUOTA_INT available, $VCPU_NEEDED needed."
                  fi
                  kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
                  kubectl create secret generic platforma-license \
                    -n $NAMESPACE \
                    --from-literal=MI_LICENSE="$LICENSE_KEY" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
                    kubectl create secret generic platforma-sso-client-secret \
                      -n $NAMESPACE \
                      --from-literal=client-secret="$GOOGLE_CLIENT_SECRET" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  fi

                  if [ "$AUTH_METHOD" = "htpasswd" ]; then
                    HTPASSWD_TRIMMED=$(echo "$HTPASSWD_CONTENT" | tr -d '[:space:]')
                    HTPASSWD_CONTENT=$(echo "$HTPASSWD_CONTENT" | tr ' ' '\n')

                    HTPASSWD_SECRET_EXISTS=0
                    HTPASSWD_MARKER=""
                    HTPASSWD_EXISTING_APR1=""
                    HTPASSWD_EXISTING_SALT=""
                    if kubectl get secret platforma-htpasswd -n $NAMESPACE >/dev/null 2>&1; then
                      HTPASSWD_SECRET_EXISTS=1
                      HTPASSWD_MARKER=$(kubectl -n $NAMESPACE get secret platforma-htpasswd \
                        -o jsonpath='{.metadata.annotations.platforma\.bio/managed-by}' 2>/dev/null) || true
                      HTPASSWD_EXISTING_APR1=$(kubectl -n $NAMESPACE get secret platforma-htpasswd \
                        -o jsonpath='{.data.htpasswd}' 2>/dev/null | base64 -d 2>/dev/null \
                        | grep -oE '\$apr1\$[^:]+' | head -1)
                      if [ -n "$HTPASSWD_EXISTING_APR1" ]; then
                        HTPASSWD_EXISTING_SALT=$(echo "$HTPASSWD_EXISTING_APR1" | cut -d'$' -f3)
                      fi
                    fi

                    LEGACY_DEPLOYER_MANAGED=0
                    if [ "$HTPASSWD_SECRET_EXISTS" = "1" ] && [ "$HTPASSWD_MARKER" != "deployer" ] && [ -n "$HTPASSWD_EXISTING_APR1" ]; then
                      SSM_PASS=$(aws ssm get-parameter \
                        --name "/${CLUSTER_NAME}/platforma/users-password" \
                        --with-decryption --query Parameter.Value --output text \
                        --region $REGION 2>/dev/null) || SSM_PASS=""
                      if [ -n "$SSM_PASS" ]; then
                        EXPECTED=$(openssl passwd -apr1 -salt "$HTPASSWD_EXISTING_SALT" "$SSM_PASS" 2>/dev/null) || EXPECTED=""
                        if [ "$HTPASSWD_EXISTING_APR1" = "$EXPECTED" ]; then
                          LEGACY_DEPLOYER_MANAGED=1
                          echo "Detected legacy deployer-managed platforma-htpasswd secret (apr1 hash matches SSM users password) — migrating: stamping the deployer marker and refreshing on this run."
                        fi
                      fi
                    fi

                    if [ -z "$HTPASSWD_TRIMMED" ] && [ "$HTPASSWD_SECRET_EXISTS" = "1" ] && [ "$HTPASSWD_MARKER" != "deployer" ] && [ "$LEGACY_DEPLOYER_MANAGED" != "1" ]; then
                      echo "Preserving operator-managed platforma-htpasswd secret (HtpasswdContent CFN parameter is empty; no deployer marker on the existing secret)."
                      echo "  → To reset to auto-generated single-user mode:"
                      echo "      1. kubectl -n $NAMESPACE delete secret platforma-htpasswd"
                      echo "      2. Bump ForceUpdatePlatforma or change a tracked parameter (a no-op stack update won't re-run the deployer)."
                    else
                      if [ -n "$HTPASSWD_TRIMMED" ] && [ "$HTPASSWD_SECRET_EXISTS" = "1" ] && [ "$HTPASSWD_MARKER" != "deployer" ] && [ "$LEGACY_DEPLOYER_MANAGED" != "1" ]; then
                        echo "WARNING: HtpasswdContent CFN parameter is non-empty AND the existing platforma-htpasswd secret has no deployer marker (likely operator-managed)."
                        echo "  → The CFN parameter content will OVERWRITE that secret."
                        echo "  → If you intended to keep the manual secret, clear HtpasswdContent in the CFN stack first and re-deploy."
                      fi

                      if [ -z "$HTPASSWD_TRIMMED" ]; then
                        EXISTING=$(aws ssm get-parameter \
                          --name "/${CLUSTER_NAME}/platforma/users-password" \
                          --with-decryption --query Parameter.Value --output text \
                          --region $REGION 2>/dev/null) || true
                        if [ -n "$EXISTING" ]; then
                          echo "Using existing users password from SSM: /${CLUSTER_NAME}/platforma/users-password"
                          USERS_PASSWORD="$EXISTING"
                        else
                          echo "No HtpasswdContent provided — generating random users password"
                          USERS_PASSWORD=$(openssl rand -base64 12)
                          aws ssm put-parameter \
                            --name "/${CLUSTER_NAME}/platforma/users-password" \
                            --type SecureString \
                            --value "$USERS_PASSWORD" \
                            --region $REGION
                          echo "Users password stored in SSM: /${CLUSTER_NAME}/platforma/users-password"
                        fi
                        if [ -n "$HTPASSWD_EXISTING_SALT" ]; then
                          HTPASSWD_CONTENT="platforma:$(openssl passwd -apr1 -salt "$HTPASSWD_EXISTING_SALT" "$USERS_PASSWORD")"
                        else
                          HTPASSWD_CONTENT="platforma:$(openssl passwd -apr1 "$USERS_PASSWORD")"
                        fi
                      fi

                      HTPASSWD_B64=$(printf '%s' "$HTPASSWD_CONTENT" | base64 -w0)
                      printf '%s\n' \
                        'apiVersion: v1' \
                        'kind: Secret' \
                        'metadata:' \
                        '  name: platforma-htpasswd' \
                        "  namespace: $NAMESPACE" \
                        '  annotations:' \
                        '    platforma.bio/managed-by: deployer' \
                        'type: Opaque' \
                        'data:' \
                        "  htpasswd: $HTPASSWD_B64" \
                        | kubectl apply -f -
                    fi
                  fi

                  EXISTING_MS=$(aws ssm get-parameter \
                    --name "/${CLUSTER_NAME}/platforma/master-secret" \
                    --with-decryption --query Parameter.Value --output text \
                    --region $REGION 2>/dev/null) || true
                  if [ -n "$EXISTING_MS" ]; then
                    echo "Using existing master secret from SSM: /${CLUSTER_NAME}/platforma/master-secret"
                    MASTER_SECRET="$EXISTING_MS"
                  else
                    echo "Generating master secret (32 bytes)"
                    MASTER_SECRET=$(openssl rand -base64 32)
                    aws ssm put-parameter \
                      --name "/${CLUSTER_NAME}/platforma/master-secret" \
                      --type SecureString \
                      --value "$MASTER_SECRET" \
                      --region $REGION
                    echo "Master secret stored in SSM: /${CLUSTER_NAME}/platforma/master-secret"
                  fi
                  kubectl create secret generic platforma-master-secret \
                    -n $NAMESPACE \
                    --from-literal=master-secret="$MASTER_SECRET" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  DATASOURCES_YAML=""
                  for LIB_NUM in 1 2 3; do
                    eval "LIB_NAME=\${DATA_LIBRARY_${LIB_NUM}_NAME:-}"
                    eval "LIB_BUCKET=\${DATA_LIBRARY_${LIB_NUM}_BUCKET:-}"
                    eval "LIB_REGION=\${DATA_LIBRARY_${LIB_NUM}_REGION:-$REGION}"
                    eval "LIB_KEY=\${DATA_LIBRARY_${LIB_NUM}_ACCESS_KEY:-}"
                    eval "LIB_SECRET=\${DATA_LIBRARY_${LIB_NUM}_SECRET_KEY:-}"
                    [ -z "$LIB_BUCKET" ] && continue
                    if [ -n "$LIB_KEY" ] && [ -z "$LIB_SECRET" ]; then
                      echo "ERROR: DataLibrary${LIB_NUM}AccessKey is set but DataLibrary${LIB_NUM}SecretKey is empty."
                      exit 1
                    fi
                    if [ -z "$LIB_KEY" ] && [ -n "$LIB_SECRET" ]; then
                      echo "ERROR: DataLibrary${LIB_NUM}SecretKey is set but DataLibrary${LIB_NUM}AccessKey is empty."
                      exit 1
                    fi
                    [ -z "$LIB_NAME" ] && LIB_NAME="library-${LIB_NUM}"
                    if [ -n "$LIB_KEY" ]; then
                      kubectl create secret generic "platforma-library-${LIB_NUM}-creds" \
                        -n $NAMESPACE \
                        --from-literal=access-key="$LIB_KEY" \
                        --from-literal=secret-key="$LIB_SECRET" \
                        --dry-run=client -o yaml | kubectl apply -f -
                      DATASOURCES_YAML="${DATASOURCES_YAML}
                  - name: ${LIB_NAME}
                    type: s3
                    s3:
                      bucket: ${LIB_BUCKET}
                      region: ${LIB_REGION}
                      secretRef:
                        name: platforma-library-${LIB_NUM}-creds"
                    else
                      DATASOURCES_YAML="${DATASOURCES_YAML}
                  - name: ${LIB_NAME}
                    type: s3
                    s3:
                      bucket: ${LIB_BUCKET}
                      region: ${LIB_REGION}"
                    fi
                  done

                  if [ "$ENABLE_DEMO_LIBRARY" = "true" ]; then
                    kubectl create secret generic "platforma-library-demo-creds" \
                      -n $NAMESPACE \
                      --from-literal=access-key="AKIAXOL6R5EBCOHXV7PC" \
                      --from-literal=secret-key="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" \
                      --dry-run=client -o yaml | kubectl apply -f -
                    DATASOURCES_YAML="${DATASOURCES_YAML}
                  - name: milabs-demo-data
                    type: s3
                    s3:
                      bucket: milab-euce1-prod-eks-s3-farm-library
                      region: eu-central-1
                      secretRef:
                        name: platforma-library-demo-creds"
                  fi

                  AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                  ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/quay-${CLUSTER_NAME}/milaboratories/pl-containers"
                  APP_EXTRA_ARGS="[\"--default-docker-registry=${ECR_REGISTRY}\"]"

                  # Grant admin role to matching logins: split ADMIN_USERS on ';'
                  # into one --admin-user=<regexp> flag each, appended to the JSON
                  # extraArgs array. jq handles JSON-escaping of regexp
                  # metacharacters (backslashes, quotes) in the patterns.
                  if [ -n "$ADMIN_USERS" ]; then
                    APP_EXTRA_ARGS=$(echo "$APP_EXTRA_ARGS" | jq -c \
                      --arg raw "$ADMIN_USERS" \
                      '. + ($raw | split(";") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0)) | map("--admin-user=" + .))')
                  fi

                  cat > /tmp/platforma-values.yaml << PLATFORMA_VALUES
                  environment: aws
                  storage:
                    database:
                      size: 50Gi
                      storageClass: gp3
                    workspace:
                      efs:
                        enabled: true
                        fileSystemId: $EFS_FILE_SYSTEM_ID
                    main:
                      type: s3
                      s3:
                        bucket: $S3_BUCKET
                        region: $REGION
                  serviceAccount:
                    create: true
                    annotations:
                      eks.amazonaws.com/role-arn: $PLATFORMA_ROLE_ARN
                  jobServiceAccount:
                    create: true
                    annotations:
                      eks.amazonaws.com/role-arn: $PLATFORMA_JOBS_ROLE_ARN
                  ingress:
                    enabled: true
                    className: alb
                    host: $DOMAIN_NAME
                    tls:
                      enabled: true
                    annotations:
                      alb.ingress.kubernetes.io/scheme: internet-facing
                      alb.ingress.kubernetes.io/target-type: ip
                      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
                      alb.ingress.kubernetes.io/certificate-arn: $CERTIFICATE_ARN
                      alb.ingress.kubernetes.io/backend-protocol-version: GRPC
                      alb.ingress.kubernetes.io/healthcheck-path: /grpc.health.v1.Health/Check
                      alb.ingress.kubernetes.io/success-codes: '0'
                  kueue:
                    maxJobResources:
                      cpu: 62
                      memory: 484Gi
                      # gpuMemory/gpuCpu/gpuRam mirror the region's highest-VRAM GPU
                      # node (one real node, computed by GpuSubnetResolver from the
                      # GPU ladder) and passed in via GPU_MAX_* env vars. GPU jobs
                      # are ceiled to these so they land on a real GPU node here.
                      gpuMemory: ${GPU_MAX_GPU_GI}Gi
                      gpuCpu: ${GPU_MAX_CPU}
                      gpuRam: ${GPU_MAX_RAM_GI}Gi
                    mode: dedicated
                    pools:
                      ui:
                        nodeSelector:
                          node.kubernetes.io/pool: ui
                        tolerations:
                          - key: dedicated
                            value: ui
                            effect: NoSchedule
                      batch:
                        nodeSelector:
                          node.kubernetes.io/pool: batch
                        tolerations:
                          - key: dedicated
                            value: batch
                            effect: NoSchedule
                      gpu:
                        enabled: ${GPU_ENABLED}
                        tolerations:
                          - key: nvidia.com/gpu
                            value: present
                            effect: NoSchedule
                    provisioningRequest:
                      enabled: true
                    dedicated:
                      resources:
                        ui:
                          cpu: $UI_QUEUE_CPU
                          memory: ${UI_QUEUE_MEMORY_GI}Gi
                        batch:
                          cpu: $BATCH_QUEUE_CPU
                          memory: ${BATCH_QUEUE_MEMORY_GI}Gi
                        gpu:
                          # cpu/memory are DERIVED by the chart from gpu × maxJobResources.gpuCpu/gpuRam;
                          # only the GPU-job concurrency count is set here.
                          gpu: 8
                  app:
                    resources:
                      requests:
                        cpu: 4
                        memory: 16Gi
                      limits:
                        cpu: 8
                        memory: 32Gi
                    # The backend runs on its own dedicated node group
                    # (PlatformaNodeGroupV1), isolated from cluster-support
                    # services on the system pool, so its memory can grow into a
                    # whole node. Select the platforma pool and tolerate its
                    # dedicated taint.
                    nodeSelector:
                      node.kubernetes.io/pool: platforma
                    tolerations:
                      - key: dedicated
                        value: platforma
                        effect: NoSchedule
                    extraArgs: ${APP_EXTRA_ARGS:-[]}
                  dataSources: ${DATASOURCES_YAML:-[]}
                  PLATFORMA_VALUES

                  if [ "$AUTH_METHOD" = "htpasswd" ]; then
                    cat >> /tmp/platforma-values.yaml << AUTH_VALUES
                  auth:
                    htpasswd:
                      secretName: platforma-htpasswd
                  AUTH_VALUES
                  elif [ "$AUTH_METHOD" = "ldap" ]; then
                    EFFECTIVE_START_TLS="${LDAP_START_TLS}"
                    if echo "$LDAP_SERVER" | grep -qi '^ldaps://'; then
                      EFFECTIVE_START_TLS="false"
                    fi
                    cat >> /tmp/platforma-values.yaml << LDAP_BLOCK
                  auth:
                    ldap:
                      server: "${LDAP_SERVER}"
                      startTLS: ${EFFECTIVE_START_TLS}
                  LDAP_BLOCK
                    if [ -n "$LDAP_BIND_DN" ]; then
                      cat >> /tmp/platforma-values.yaml << LDAP_BIND
                      bindDN: "${LDAP_BIND_DN}"
                  LDAP_BIND
                    fi
                    if [ -n "$LDAP_SEARCH_USER" ]; then
                      cat >> /tmp/platforma-values.yaml << LDAP_SEARCH
                      searchUser: "${LDAP_SEARCH_USER}"
                      searchPassword: "${LDAP_SEARCH_PASSWORD}"
                  LDAP_SEARCH
                    fi
                    if [ -n "$LDAP_SEARCH_RULES" ]; then
                      echo "    searchRules:" >> /tmp/platforma-values.yaml
                      OLD_IFS="$IFS"
                      IFS=";"
                      for rule in $LDAP_SEARCH_RULES; do
                        IFS="$OLD_IFS"
                        rule=$(echo "$rule" | xargs)
                        [ -z "$rule" ] && { IFS=";"; continue; }
                        echo "      - \"${rule}\"" >> /tmp/platforma-values.yaml
                        IFS=";"
                      done
                      IFS="$OLD_IFS"
                    fi
                  elif [ "$AUTH_METHOD" = "google" ]; then
                    cat >> /tmp/platforma-values.yaml << GOOGLE_BLOCK
                  auth:
                    sso:
                      issuer: "https://accounts.google.com"
                      clientId: "${GOOGLE_CLIENT_ID}"
                      scopes: "openid profile email"
                      prompt: "consent"
                      accessType: "offline"
                      clientSecret:
                        secretName: platforma-sso-client-secret
                  GOOGLE_BLOCK
                  elif [ "$AUTH_METHOD" = "entra" ]; then
                    if [ -z "$ENTRA_ISSUER" ] && [ -n "$ENTRA_TENANT_ID" ]; then
                      ENTRA_ISSUER="https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0"
                    elif echo "$ENTRA_ISSUER" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
                      ENTRA_ISSUER="https://login.microsoftonline.com/${ENTRA_ISSUER}/v2.0"
                    fi
                    cat >> /tmp/platforma-values.yaml << ENTRA_BLOCK
                  auth:
                    sso:
                      issuer: "${ENTRA_ISSUER}"
                      clientId: "${ENTRA_CLIENT_ID}"
                  ENTRA_BLOCK
                  fi

                  cat >> /tmp/platforma-values.yaml << MASTER_SECRET_VALUES
                  masterSecret:
                    secretName: platforma-master-secret
                  MASTER_SECRET_VALUES

                  if [ -n "$PLATFORMA_IMAGE" ]; then
                    IMG_REPO=$(echo "$PLATFORMA_IMAGE" | sed 's/:.*//')
                    IMG_TAG=$(echo "$PLATFORMA_IMAGE" | sed 's/.*://')
                    cat >> /tmp/platforma-values.yaml << IMAGE_BLOCK
                  image:
                    repository: "${IMG_REPO}"
                    tag: "${IMG_TAG}"
                  IMAGE_BLOCK
                  fi

                  if echo "$PLATFORMA_HELM_CHART" | grep -q 'ecr.*amazonaws.com'; then
                    HELM_ECR_HOST=$(echo "$PLATFORMA_HELM_CHART" | sed 's|oci://||' | cut -d/ -f1)
                    HELM_ECR_REGION=$(echo "$HELM_ECR_HOST" | cut -d. -f4)
                    aws ecr get-login-password --region "$HELM_ECR_REGION" | helm registry login --username AWS --password-stdin "$HELM_ECR_HOST"
                  fi

                  helm upgrade --install platforma $PLATFORMA_HELM_CHART \
                    --version $PLATFORMA_VERSION \
                    -n $NAMESPACE \
                    -f /tmp/platforma-values.yaml \
                    --set auth.showUserList=${SHOW_USER_LIST:-true} \
                    --atomic --timeout 15m
            post_build:
              commands:
                - |
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
                    STATUS="SUCCESS"
                    REASON="Platforma deployment completed successfully"
                  else
                    STATUS="FAILED"
                    REASON="Platforma deployment failed. Check CodeBuild logs: $CODEBUILD_BUILD_ID"
                  fi
                  PHYSICAL_ID="${CLUSTER_NAME}-platforma-deployer"
                  curl -s -X PUT -H "Content-Type: " \
                    -d "{\"Status\":\"$STATUS\",\"Reason\":\"$REASON\",\"PhysicalResourceId\":\"$PHYSICAL_ID\",\"StackId\":\"$CFN_STACK_ID\",\"RequestId\":\"$CFN_REQUEST_ID\",\"LogicalResourceId\":\"$CFN_LOGICAL_ID\",\"Data\":{}}" \
                    "$CFN_RESPONSE_URL"

  TriggerHelmDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-${AWS::Region}-helm-trigger'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartCodeBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource:
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ClusterName}-helm-deployer'
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ClusterName}-platforma-deployer'
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  TriggerHelmDeployFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - HelmDeployerProject
      - PlatformaDeployerProject
    Properties:
      FunctionName: !Sub '${ClusterName}-helm-trigger'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TriggerHelmDeployRole.Arn
      Timeout: 30
      Tags:
        - Key: platforma
          Value: !Ref ClusterName
      Environment:
        Variables:
          CODEBUILD_PROJECT: !Sub '${ClusterName}-helm-deployer'
      Code:
        ZipFile: |
          import boto3, json, os, urllib.request
          def handler(event, context):
            # Read project name from custom resource properties (allows one Lambda
            # to serve both infra and platforma triggers). Falls back to env var.
            props = event.get('ResourceProperties', {})
            project = props.get('CodeBuildProject', os.environ['CODEBUILD_PROJECT'])
            # Stable physical resource ID prevents CF cleanup deletes from
            # triggering teardown on every update.
            stable_id = project
            extra = []
            if event['RequestType'] == 'Delete':
              old_id = event.get('PhysicalResourceId', '')
              if old_id != stable_id:
                # CF is cleaning up an old physical resource (e.g., from a
                # previous update that used the build ID). Just acknowledge.
                print(f'Cleanup delete for old resource {old_id}, skipping teardown')
                send(event, 'SUCCESS', {}, stable_id)
                return
              extra = [{'name': 'TEARDOWN', 'value': 'true', 'type': 'PLAINTEXT'}]
            try:
              cb = boto3.client('codebuild')
              resp = cb.start_build(
                projectName=project,
                environmentVariablesOverride=[
                  {'name': 'CFN_RESPONSE_URL', 'value': event['ResponseURL'], 'type': 'PLAINTEXT'},
                  {'name': 'CFN_STACK_ID',     'value': event['StackId'],     'type': 'PLAINTEXT'},
                  {'name': 'CFN_REQUEST_ID',   'value': event['RequestId'],   'type': 'PLAINTEXT'},
                  {'name': 'CFN_LOGICAL_ID',   'value': event['LogicalResourceId'], 'type': 'PLAINTEXT'},
                ] + extra
              )
              print(f'Started CodeBuild build: {resp["build"]["id"]}')
            except Exception as e:
              print(f'Failed to start CodeBuild: {e}')
              send(event, 'FAILED', {'Error': str(e)}, stable_id)
          def send(event, status, data, physical_id=None):
            body = json.dumps({
              'Status': status,
              'Reason': 'See CloudWatch Logs',
              'PhysicalResourceId': physical_id or event.get('PhysicalResourceId', 'helm-deployer'),
              'StackId': event['StackId'],
              'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'],
              'Data': data
            })
            req = urllib.request.Request(
              event['ResponseURL'], data=body.encode(), method='PUT',
              headers={'Content-Type': ''}
            )
            urllib.request.urlopen(req)

  TriggerHelmDeploy:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - HelmDeployerAccessEntry
      - EbsCsiAddon
      - EfsCsiAddon
    Properties:
      ServiceToken: !GetAtt TriggerHelmDeployFunction.Arn
      CodeBuildProject: !Sub '${ClusterName}-helm-deployer'
      # --- Trigger properties ---
      # CF re-invokes this resource whenever ANY property value changes.
      # Version properties MUST match HelmDeployerProject env vars above.
      # This duplication is intentional — CF needs property changes to
      # detect when re-deployment is required.
      KubernetesVersion: !FindInMap [Constants, EKS, Version]
      KueueVersion: '0.16.1'
      AppWrapperVersion: 'v1.2.0'
      ClusterAutoscalerChartVersion: '9.56.0'
      ExternalDnsVersion: '1.20.0'
      AlbControllerVersion: '3.0.0'
      # Bump for non-version buildspec changes (new flags, RBAC, install order)
      BuildSpecRevision: '3'

  TriggerPlatformaDeploy:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - TriggerHelmDeploy
      # The backend pins to the dedicated platforma pool (app.nodeSelector +
      # toleration); the helm install is --atomic, so the node must exist first
      # or the deploy rolls back.
      - PlatformaNodeGroupV1
      - EfsMountTarget1
      - EfsMountTarget2
      - EfsMountTarget3
      - S3Bucket
      - Certificate
    Properties:
      ServiceToken: !GetAtt TriggerHelmDeployFunction.Arn
      CodeBuildProject: !Sub '${ClusterName}-platforma-deployer'
      # Properties below trigger re-deployment when changed during stack update.
      # CF re-invokes this custom resource (and thus re-runs the platforma
      # deployer CodeBuild) whenever ANY property value here changes.
      ForceUpdatePlatforma: "4" # Bump to force Platforma re-deployment
      # GPU inputs mirror the platforma-deployer env vars (GPU_ENABLED /
      # GPU_MAX_*). Watching them here means flipping EnableGpu — or a change to
      # the region's resolved GPU ceilings — re-triggers a Platforma deploy so
      # the backend's gpu.enabled and --k8s-gpu-max-* flags actually update.
      # Without these, toggling EnableGpu only adds/removes the GPU node groups
      # (via the Gpu*Enabled Conditions) while the backend flags silently go
      # stale until the next unrelated deploy or a manual ForceUpdatePlatforma bump.
      EnableGpu:   !Ref EnableGpu
      GpuMaxCpu:   !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxCpu,   '0']
      GpuMaxRamGi: !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxRamGi, '0']
      GpuMaxGpuGi: !If [GpuEnabled, !GetAtt GpuSubnetResolver.GpuMaxGpuGi, '0']
      # Resolved sizing values mirror the platforma-deployer env vars. Watching
      # them here means a change to the DeploymentSize Mappings (e.g.
      # BatchMemoryGi 4000 -> 3872 when we tightened the per-node ceiling)
      # re-triggers a deploy automatically — the DeploymentSize *label*
      # ("xlarge") is unchanged, so without these the values silently went
      # stale on stack updates and required a manual ForceUpdatePlatforma bump.
      BatchQueueCpu:      !FindInMap [DeploymentSize, !Ref DeploymentSize, BatchCpu]
      BatchQueueMemoryGi: !FindInMap [DeploymentSize, !Ref DeploymentSize, BatchMemoryGi]
      # Bump when changing platforma values that are hardcoded in the deployer
      # buildspec (not derived from a Mapping above) — e.g.
      # kueue.maxJobResources.memory or app.resources.limits.memory. Mirrors
      # the BuildSpecRevision pattern on TriggerHelmDeploy.
      PlatformaValuesRevision: "1"
      PlatformaVersion: !If
        - UseDefaultPlatformaVersion
        - !FindInMap [Constants, Platforma, Version]
        - !Ref PlatformaVersion
      PlatformaImage: !Ref PlatformaImage
      DeployPlatforma: !Ref DeployPlatforma
      LicenseKey: !Ref LicenseKey
      AuthMethod: !Ref AuthMethod
      HtpasswdContent: !Ref HtpasswdContent
      LdapServer: !Ref LdapServer
      LdapStartTLS: !Ref LdapStartTLS
      LdapBindDN: !Ref LdapBindDN
      LdapSearchRules: !Ref LdapSearchRules
      LdapSearchUser: !Ref LdapSearchUser
      LdapSearchPassword: !Ref LdapSearchPassword
      DomainName: !Ref DomainName
      DeploymentSize: !Ref DeploymentSize
      DataLibrary1Name: !Ref DataLibrary1Name
      DataLibrary1Bucket: !Ref DataLibrary1Bucket
      DataLibrary1Region: !Ref DataLibrary1Region
      DataLibrary1AccessKey: !Ref DataLibrary1AccessKey
      DataLibrary1SecretKey: !Ref DataLibrary1SecretKey
      DataLibrary2Name: !Ref DataLibrary2Name
      DataLibrary2Bucket: !Ref DataLibrary2Bucket
      DataLibrary2Region: !Ref DataLibrary2Region
      DataLibrary2AccessKey: !Ref DataLibrary2AccessKey
      DataLibrary2SecretKey: !Ref DataLibrary2SecretKey
      DataLibrary3Name: !Ref DataLibrary3Name
      DataLibrary3Bucket: !Ref DataLibrary3Bucket
      DataLibrary3Region: !Ref DataLibrary3Region
      DataLibrary3AccessKey: !Ref DataLibrary3AccessKey
      DataLibrary3SecretKey: !Ref DataLibrary3SecretKey

  # ---------------------------------------------------------------------------
  # 6. Storage — EFS (shared workspace)
  # ---------------------------------------------------------------------------
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DependsOn: EksCluster  # required to resolve EksCluster.ClusterSecurityGroupId
    Properties:
      GroupDescription: !Sub 'Allow NFS traffic to Platforma EFS - ${ClusterName}'
      VpcId: !If [CreateNewVpc, !Ref Vpc, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-efs-sg'
        - Key: platforma
          Value: !Ref ClusterName

  EfsFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub '${ClusterName}-workspace'
        - Key: platforma
          Value: !Ref ClusterName

  # Mount targets — one per AZ for HA access from all nodes
  EfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !If [CreateNewVpc, !Ref PrivateSubnet1, !Select [0, !Ref PrivateSubnetIds]]
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !If [CreateNewVpc, !Ref PrivateSubnet2, !Select [1, !Ref PrivateSubnetIds]]
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTarget3:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !If [CreateNewVpc, !Ref PrivateSubnet3, !Select [2, !Ref PrivateSubnetIds]]
      SecurityGroups:
        - !Ref EfsSecurityGroup

  # ---------------------------------------------------------------------------
  # 7. Storage — S3 bucket (primary storage)
  # ---------------------------------------------------------------------------
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - AutoGenerateS3Name
        - !Join
          - '-'
          - - 'platforma'
            - !Ref ClusterName
            - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        - !Ref S3BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  # =========================================================================
  # ECR Pull-Through Cache (optional)
  # =========================================================================
  # Caches container images from Quay.io (upstream of containers.pl-open.science)
  # in a same-region ECR registry for lower pull latency and to avoid
  # overloading the upstream HAProxy with first-boot image downloads.
  #
  # The cache prefix is namespaced with the cluster name so multiple
  # Platforma stacks in the same AWS account/region coexist — AWS allows
  # only one PullThroughCacheRule per (account, region, prefix).

  ECRPullThroughCacheRule:
    Type: AWS::ECR::PullThroughCacheRule
    Properties:
      EcrRepositoryPrefix: !Sub 'quay-${ClusterName}'
      UpstreamRegistryUrl: quay.io

  # Lifecycle policy applied to the main image repository.
  # Repositories are auto-created by pull-through on first pull, but we
  # pre-create this one to attach the lifecycle policy.
  ECRCacheRepository:
    Type: AWS::ECR::Repository
    DependsOn: ECRPullThroughCacheRule
    Properties:
      RepositoryName: !Sub 'quay-${ClusterName}/milaboratories/pl-containers'
      # Allow CF to delete the repo on stack teardown even if it still holds
      # cached images — without this CF refuses and fails the delete.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire images older than 90 days",
                "selection": {
                  "tagStatus": "any",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 90
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: platforma
          Value: !Ref ClusterName

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt S3Bucket.Arn
              - !Sub '${S3Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # Access control relies on IAM: only the Platforma IRSA role has
          # s3:* permissions on this bucket via its inline policy. Removing
          # the previous deny-all-except-role pattern because it locked out
          # account administrators from cleanup after stack deletion
          # (the IRSA role is deleted with the stack, leaving no one with access).

  # ---------------------------------------------------------------------------
  # 8. ACM Certificate (DNS-validated via Route53)
  # ---------------------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-certificate'
        - Key: platforma
          Value: !Ref ClusterName

# =============================================================================
# Outputs
# =============================================================================
Outputs:
  PlatformaUrl:
    Description: >
      Platforma URL. Connect to this address using the Platforma Desktop App.
    Value: !Sub 'https://${DomainName}'

  DefaultUsername:
    Condition: IsHtpasswd
    Description: >
      Default username for Platforma login (htpasswd mode, auto-generated password).
    Value: platforma

  UsersPasswordSSMPath:
    Condition: IsHtpasswd
    Description: >
      SSM Parameter containing auto-generated users password (htpasswd mode only).
      Retrieve with: aws ssm get-parameter --name /<ClusterName>/platforma/users-password --with-decryption --query Parameter.Value --output text
    Value: !Sub '/${ClusterName}/platforma/users-password'

  UsersPasswordSSMConsole:
    Condition: IsHtpasswd
    Description: >
      Click to open the SSM Parameter with the auto-generated users password.
      Click "Show" on the parameter page to reveal the value.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/parameters/%2F${ClusterName}%2Fplatforma%2Fusers-password/description?region=${AWS::Region}'

  ClusterName:
    Description: >
      EKS cluster name. To access the cluster:
      aws eks update-kubeconfig --name <ClusterName> --region <Region>
    Value: !Ref EksCluster

  S3BucketOutput:
    Description: S3 bucket name for primary storage (retained on stack deletion)
    Value: !Ref S3Bucket

  Region:
    Description: AWS region where the cluster is deployed
    Value: !Ref AWS::Region

  HelmDeployerBuildProject:
    Description: >
      CodeBuild project that deploys infrastructure controllers (Kueue, AppWrapper,
      Cluster Autoscaler, ALB Controller, External DNS). Check logs here if the stack fails.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/${AWS::AccountId}/projects/${ClusterName}-helm-deployer/history?region=${AWS::Region}'

  PlatformaDeployerBuildProject:
    Description: >
      CodeBuild project that deploys Platforma. Check logs here if Platforma deployment fails.
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/${AWS::AccountId}/projects/${ClusterName}-platforma-deployer/history?region=${AWS::Region}'

  PostDeploySteps:
    Description: What to do after the stack completes
    Value: >-
      Stack deploys everything automatically. Once complete, connect the Platforma
      Desktop App to your domain on port 443. If deployment fails, check the CodeBuild
      project logs (see HelmDeployerBuildProject and PlatformaDeployerBuildProject outputs).
