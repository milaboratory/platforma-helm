# =============================================================================
# AWS EKS Cluster Configuration (eksctl)
# =============================================================================
# Creates EKS cluster with:
# - System node group (Kueue, controllers, CoreDNS, CSI, metrics-server)
# - Platforma node group (dedicated to the Platforma backend, tainted)
# - UI node group (interactive tasks, scale-from-zero)
# - 5 batch node groups: 16c-64g, 32c-128g, 64c-256g, 32c-256g, 64c-512g
# - EFS CSI driver addon (for RWX workspace storage)
# - EBS CSI driver addon (for gp3 database/main storage)
#
# Usage:
#   sed "s/platforma-cluster/${CLUSTER_NAME}/g; s/eu-central-1/${AWS_REGION}/g" \
#     eksctl-cluster.yaml | eksctl create cluster -f -
#
# Cluster Autoscaler discovery uses EKS auto-tag (eks:cluster-name).
# No manual autoscaler tags needed for managed node groups.
# =============================================================================

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: platforma-cluster
  region: eu-central-1
  version: "1.35"

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
  - name: aws-efs-csi-driver
    version: latest
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEFSCSIDriverPolicy

managedNodeGroups:
  # System nodes — cluster-support services only (Kueue, controllers, CoreDNS,
  # CSI, metrics-server). The Platforma backend runs on its own node group below
  # so the two never contend for memory (MILAB-6566).
  # m7i.2xlarge: 8 vCPU / 32 GiB
  - name: system
    instanceType: m7i.2xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 3
    labels:
      node.kubernetes.io/pool: system
    tags:
      nodegroup-type: system
      platforma: platforma-cluster

  # Platforma backend — dedicated node, tainted so only the Platforma server
  # (which tolerates dedicated=platforma and selects pool=platforma) lands here,
  # giving its memory room to grow into a whole node (MILAB-6566).
  # m7i.4xlarge: 16 vCPU / 64 GiB
  - name: platforma
    instanceType: m7i.4xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    # Pin to a single AZ — the backend's database and logs PersistentVolumes
    # (zonal EBS gp3, from the chart's pvc-database / pvc-logs) can only attach
    # to a node in their own AZ, so a node replacement landing elsewhere would
    # leave the pod Pending on a volume node-affinity conflict. Must match the AZ
    # of those volumes (the 'a' suffix is preserved by the region sed at the top;
    # change it if your volumes live elsewhere). The CloudFormation path does the
    # same via SystemNodeAZ.
    availabilityZones: ["eu-central-1a"]
    labels:
      node.kubernetes.io/pool: platforma
    taints:
      - key: dedicated
        value: platforma
        effect: NoSchedule
    tags:
      nodegroup-type: platforma
      platforma: platforma-cluster

  # UI nodes — interactive tasks, scale from zero
  # t3.xlarge: 4 vCPU / 16 GiB
  - name: ui
    instanceType: t3.xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    labels:
      node.kubernetes.io/pool: ui
    taints:
      - key: dedicated
        value: ui
        effect: NoSchedule
    tags:
      nodegroup-type: ui
      platforma: platforma-cluster

  # Batch: 16 vCPU / 64 GiB (scale from zero)
  # m7i.4xlarge
  - name: batch-16c-64g
    instanceType: m7i.4xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 4
    labels:
      node.kubernetes.io/pool: batch
    taints:
      - key: dedicated
        value: batch
        effect: NoSchedule
    tags:
      nodegroup-type: batch-16c-64g
      platforma: platforma-cluster

  # Batch: 32 vCPU / 128 GiB (scale from zero)
  # m7i.8xlarge
  - name: batch-32c-128g
    instanceType: m7i.8xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 2
    labels:
      node.kubernetes.io/pool: batch
    taints:
      - key: dedicated
        value: batch
        effect: NoSchedule
    tags:
      nodegroup-type: batch-32c-128g
      platforma: platforma-cluster

  # Batch: 64 vCPU / 256 GiB (scale from zero)
  # m7i.16xlarge
  - name: batch-64c-256g
    instanceType: m7i.16xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 1
    labels:
      node.kubernetes.io/pool: batch
    taints:
      - key: dedicated
        value: batch
        effect: NoSchedule
    tags:
      nodegroup-type: batch-64c-256g
      platforma: platforma-cluster

  # Batch: 32 vCPU / 256 GiB — high memory (scale from zero)
  # r7i.8xlarge
  - name: batch-32c-256g
    instanceType: r7i.8xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 2
    labels:
      node.kubernetes.io/pool: batch
    taints:
      - key: dedicated
        value: batch
        effect: NoSchedule
    tags:
      nodegroup-type: batch-32c-256g
      platforma: platforma-cluster

  # Batch: 64 vCPU / 512 GiB — largest high memory (scale from zero)
  # r7i.16xlarge
  - name: batch-64c-512g
    instanceType: r7i.16xlarge
    desiredCapacity: 0
    minSize: 0
    maxSize: 1
    labels:
      node.kubernetes.io/pool: batch
    taints:
      - key: dedicated
        value: batch
        effect: NoSchedule
    tags:
      nodegroup-type: batch-64c-512g
      platforma: platforma-cluster

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
