# =============================================================================
# GKE Staging — New Platforma Helm Chart Values
# =============================================================================
# Cluster: mik8s-euwe3-prod-gke-cluster (europe-west3)
# Release: gke-staging
# Namespace: platforma-e2e
# Chart: platforma-helm/charts/platforma (new chart)
# =============================================================================

# -- Container image
image:
  repository: quay.io/milaboratories/platforma
  tag: 3.2.2
  pullPolicy: Always

# -- Cloud environment
environment: gcp

# -- License
license:
  secretName: "platforma-license"
  secretKey: "MI_LICENSE"

# =============================================================================
# Authentication — LDAP (Foxpass)
# =============================================================================
auth:
  ldap:
    server: "ldaps://ldap.eu.foxpass.com"
    searchRules:
      - "(&(uid=%u)(memberOf=cn=milaboratories,ou=groups,dc=milaboratories,dc=com))|dc=milaboratories,dc=com"
    searchUser: "cn=r2d2,dc=milaboratories,dc=com"
    searchPasswordSecretRef:
      name: "platforma-ldap-password"
      key: "password"

# =============================================================================
# Storage
# =============================================================================
storage:
  database:
    size: 20Gi
    storageClass: "standard-rwo"

  workspace:
    existingClaim: "filestore-fast-pvc"

  main:
    type: gcs
    gcs:
      bucket: "mik8s-platforma-euwe3-prod-gke"
      projectId: "mik8s-euwe3-prod-gke-project"
      prefix: "platforma-primary-staging/"
      serviceAccount: "mik8s-platforma-access@mik8s-euwe3-prod-gke-project.iam.gserviceaccount.com"

dataSources:
  - name: "library"
    type: gcs
    gcs:
      bucket: "mik8s-platforma-library-euwe3-prod-gke"
      projectId: "mik8s-euwe3-prod-gke-project"
      serviceAccount: "mik8s-platforma-access@mik8s-euwe3-prod-gke-project.iam.gserviceaccount.com"
  - name: "test-assets"
    type: gcs
    gcs:
      bucket: "mik8s-platforma-euwe3-prod-gke"
      projectId: "mik8s-euwe3-prod-gke-project"
      prefix: "test-assets/"
      serviceAccount: "mik8s-platforma-access@mik8s-euwe3-prod-gke-project.iam.gserviceaccount.com"

# =============================================================================
# Job Execution — Hybrid (Kueue + Google Batch)
# =============================================================================
# ui-tasks: local executor (inside Platforma pod)
# light/medium/heavy: Google Batch (VMs provisioned on demand)
kueue:
  mode: dedicated
  maxJobResources:
    cpu: 64
    memory: 256Gi
  pools:
    ui:
      nodeSelector:
        pool: ui
      tolerations:
        - key: dedicated
          value: ui
          effect: NoSchedule
    batch:
      nodeSelector:
        pool: batch
      tolerations:
        - key: dedicated
          value: batch
          effect: NoSchedule
  provisioningRequest:
    enabled: true
  dedicated:
    createClusterResources: true
    resources:
      ui:
        cpu: 16
        memory: 64Gi
      batch:
        cpu: 128
        memory: 512Gi

# =============================================================================
# Networking — Nginx Ingress
# =============================================================================
ingress:
  enabled: true
  className: "nginx"
  host: "gke-staging.gcp.milaboratories.com"
  tls:
    enabled: true
    secretName: "gcp-milaboratories-tls"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    external-dns.alpha.kubernetes.io/hostname: "gke-staging.gcp.milaboratories.com"

# =============================================================================
# Application
# =============================================================================
app:
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 12Gi

  extraArgs:
    - "--keep-faulty-workdirs=16h"
    - "--assets-registry-url=https://mik8s-assets-sync-euwe3-prod-gke.storage.googleapis.com/"
    # Queue routing — batch queues to Google Batch
    - "--queue-runner=light:google-batch"
    - "--queue-runner=medium:google-batch"
    - "--queue-runner=heavy:google-batch"
    # Google Batch configuration
    - "--google-batch-storage=/data/workspace=nfs://10.244.108.130/nfs_share"
    - "--google-batch-project=mik8s-euwe3-prod-gke-project"
    - "--google-batch-region=europe-west3"
    - "--google-batch-job-name-prefix=gke-staging"
    - "--google-batch-network=projects/mik8s-euwe3-prod-gke-project/global/networks/mik8s-euwe3-prod-gke-vpc"
    - "--google-batch-subnetwork=projects/mik8s-euwe3-prod-gke-project/regions/europe-west3/subnetworks/mik8s-euwe3-prod-gke-private-1"
    - "--google-batch-provisioning=STANDARD"
    - "--google-batch-service-account=mik8s-platforma-access@mik8s-euwe3-prod-gke-project.iam.gserviceaccount.com"
    - "--google-batch-custom-job-template=/data/workspace/batch-job-template.tmpl"

  debug:
    enabled: true

  logging:
    persistence:
      enabled: false

  monitoring:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

serviceAccount:
  create: true
  name: "platforma-sa"
  annotations:
    iam.gke.io/gcp-service-account: "mik8s-platforma-access@mik8s-euwe3-prod-gke-project.iam.gserviceaccount.com"
